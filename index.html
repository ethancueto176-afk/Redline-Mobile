function setStatus(message){

function stopRoomListener(){
 if(roomUnsubscribe){
  roomUnsubscribe();
  roomUnsubscribe=null;
 }
}

function makeRoomCode(){
 return String(Math.floor(1000+Math.random()*9000));
}

async function createRoom(visibility){
 try{
  setStatus("CREATING "+visibility.toUpperCase()+" ROOM...");
  await authReady;
  const uid=auth.currentUser.uid;

  for(let attempt=0;attempt<12;attempt++){
   const code=makeRoomCode();
   const roomRef=doc(db,"rooms",code);
   const roomSnap=await getDoc(roomRef);
   if(roomSnap.exists())continue;

   await setDoc(roomRef,{
    code,
    hostUid:uid,
    players:[uid],
    votes:[],
    visibility,
    status:"open",
    createdAt:serverTimestamp()
   });

   currentRoomCode=code;
   openWaitingRoom(code);
   return;
  }
  setStatus("COULD NOT CREATE ROOM — TRY AGAIN");
 }catch(error){
  console.error("Create room error:",error);
  setStatus("ROOM ERROR: "+(error.code||error.message));
 }
}

async function joinRoom(code){
 await authReady;
 const roomRef=doc(db,"rooms",code);
 await runTransaction(db,async transaction=>{
  const snap=await transaction.get(roomRef);
  if(!snap.exists())throw new Error("ROOM_NOT_FOUND");
  const room=snap.data();
  if(room.status!=="open")throw new Error("ROOM_CLOSED");
  const players=Array.isArray(room.players)?room.players:[room.hostUid].filter(Boolean);
  if(!players.includes(auth.currentUser.uid)){
   players.push(auth.currentUser.uid);
  }
  transaction.update(roomRef,{players});
 });
 currentRoomCode=code;
 openWaitingRoom(code);
}

async function joinPrivateRoom(){
 const entered=prompt("Enter your friend's 4-digit room code:");
 if(!entered)return;
 const code=entered.trim();
 if(!/^\d{4}$/.test(code)){
  setStatus("PLEASE ENTER A 4-DIGIT CODE");
  return;
 }
 try{
  setStatus("JOINING ROOM "+code+"...");
  await joinRoom(code);
 }catch(error){
  console.error("Join room error:",error);
  const message=error.message==="ROOM_NOT_FOUND"?"ROOM NOT FOUND":
   error.message==="ROOM_CLOSED"?"THIS ROOM HAS ALREADY STARTED":
   (error.code||error.message);
  screenMessage(message);
  setStatus("JOIN ERROR: "+message);
 }
}

async function joinPublicServer(){
 try{
  setStatus("FINDING A PUBLIC SERVER...");
  await authReady;
  const roomsSnap=await getDocs(collection(db,"rooms"));
  const openRoom=roomsSnap.docs.find(item=>{
   const room=item.data();
   const players=Array.isArray(room.players)?room.players:[room.hostUid].filter(Boolean);
   return room.visibility==="public" && room.status==="open" &&
    players.length<10 && !players.includes(auth.currentUser.uid);
  });

  if(openRoom){
   await joinRoom(openRoom.id);
   setStatus("JOINED PUBLIC SERVER");
   return;
  }

  setStatus("NO OPEN PUBLIC SERVER — CREATING ONE...");
  await createRoom("public");
 }catch(error){
  console.error("Public matchmaking error:",error);
  setStatus("PUBLIC SERVER ERROR: "+(error.code||error.message));
 }
}

async function voteToStart(){
 if(!currentRoomCode)return;
 try{
  await authReady;
  const roomRef=doc(db,"rooms",currentRoomCode);
  let gameStarted=false;
  let voteCount=0;
  let playerCount=0;

  await runTransaction(db,async transaction=>{
   const snap=await transaction.get(roomRef);
   if(!snap.exists())throw new Error("ROOM_NOT_FOUND");
   const room=snap.data();
   if(room.status!=="open")throw new Error("GAME_ALREADY_STARTED");

   const players=Array.isArray(room.players)?room.players:[room.hostUid].filter(Boolean);
   const votes=Array.isArray(room.votes)?room.votes:[];
   if(!players.includes(auth.currentUser.uid))throw new Error("NOT_IN_ROOM");

   if(!votes.includes(auth.currentUser.uid))votes.push(auth.currentUser.uid);
   gameStarted=players.length>0 && players.every(uid=>votes.includes(uid));
   voteCount=votes.length;
   playerCount=players.length;

   transaction.update(roomRef,{
    players,
    votes,
    status:gameStarted?"started":"open",
    startedAt:gameStarted?serverTimestamp():null
   });
  });

  if(gameStarted){
   gameMode="MATCH";
   screenMessage("MATCH STARTED!");
   setStatus("EVERYONE VOTED — MATCH STARTED!");
  }else{
   setStatus("START VOTE: "+voteCount+"/"+playerCount+" PLAYERS");
  }
 }catch(error){
  console.error("Start vote error:",error);
  setStatus("VOTE ERROR: "+(error.code||error.message));
 }
}

async function leaveRoom(){
 stopRoomListener();
 if(!currentRoomCode){
  showMainMenu();
  return;
 }
 const code=currentRoomCode;
 currentRoomCode="";
 try{
  await authReady;
  const roomRef=doc(db,"rooms",code);
  await runTransaction(db,async transaction=>{
   const snap=await transaction.get(roomRef);
   if(!snap.exists())return;
   const room=snap.data();
   const players=Array.isArray(room.players)?room.players:[room.hostUid].filter(Boolean);
   const votes=Array.isArray(room.votes)?room.votes:[];
   const uid=auth.currentUser.uid;
   const remaining=players.filter(id=>id!==uid);
   const remainingVotes=votes.filter(id=>id!==uid);
   if(remaining.length===0){
    transaction.update(roomRef,{players:[],votes:[],status:"closed"});
   }else{
    const changes={players:remaining,votes:remainingVotes};
    if(room.hostUid===uid)changes.hostUid=remaining[0];
    transaction.update(roomRef,changes);
   }
  });
 }catch(error){
  console.error("Leave room error:",error);
 }
 showMainMenu();
 setStatus("YOU LEFT THE ROOM");
}

function makeText(message,color="#ffffff"){
 const canvas=document.createElement("canvas");
 canvas.width=1024;
 canvas.height=256;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="#10131c";
 ctx.fillRect(0,0,1024,256);
 ctx.fillStyle=color;
 ctx.font="bold 65px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(message,512,128);
 const texture=new THREE.CanvasTexture(canvas);
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}
function solidBox(w,h,d,color,x,y,z,parent){

  new THREE.MeshStandardMaterial({color,roughness:.8}));
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

arms.push(makeArm());
function setArmVisible(arm,visible){
 arm.arm.visible=visible;
 arm.hand.visible=visible;
 for(const band of arm.bands)band.visible=visible;
}
function updateSegment(mesh,start,end){
 const direction=new THREE.Vector3().subVectors(end,start);
 const length=direction.length();
 mesh.position.copy(start).add(end).multiplyScalar(.5);
 mesh.scale.y=length;
 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());
}

const raycaster=new THREE.Raycaster();
const headPosition=new THREE.Vector3();
const deskPosition=new THREE.Vector3();
const handPosition=new THREE.Vector3();
const shoulder=new THREE.Vector3();

function computerDistance(){
 const view=renderer.xr.isPresenting?renderer.xr.getCamera(camera):camera;
 view.getWorldPosition(headPosition);
 deskPosition.set(0,1.6,-7);
 return headPosition.distanceTo(deskPosition);
}
function checkController(controller){
 if(!renderer.xr.isPresenting)return;
 if(computerDistance()>3.5)return;
 const origin=new THREE.Vector3();
 const direction=new THREE.Vector3();
 const rotation=new THREE.Quaternion();
 controller.getWorldPosition(origin);
 controller.getWorldQuaternion(rotation);
 direction.set(0,0,-1).applyQuaternion(rotation);
 raycaster.set(origin,direction);
 raycaster.far=5;
 const hits=raycaster.intersectObjects(menuButtons,false);
 if(hits.length&&hits[0].object.userData.action){
  hits[0].object.userData.action();
 }
}

// ===================================
// HEIGHT CALIBRATION
// ===================================
let calibrated=false;
let playerHeight=1.6;
let calibrationAttempts=0;
function calibrateHeight(){
 if(calibrated||!renderer.xr.isPresenting)return;
 const view=renderer.xr.getCamera(camera);
 view.getWorldPosition(headPosition);
 const measuredHeight=headPosition.y-playerRig.position.y;
 if(measuredHeight>.5&&measuredHeight<3){
  playerHeight=THREE.MathUtils.clamp(measuredHeight,1,2.3);
  calibrated=true;
  setStatus("VR READY — HEIGHT SET: "+playerHeight.toFixed(2)+" METERS");
  return;
 }
 calibrationAttempts++;
 if(calibrationAttempts>120){
  playerHeight=1.6;
  calibrated=true;
  setStatus("VR READY — DEFAULT HEIGHT SET");
 }
}

document.getElementById("enterVR").addEventListener("click",async()=>{
 try{
  if(!navigator.xr){
   setStatus("VR IS NOT AVAILABLE IN THIS BROWSER");
   return;
  }
  const supported=await navigator.xr.isSessionSupported("immersive-vr");
  if(!supported){
   setStatus("VR NOT SUPPORTED — TAP ENTER GAME");
   return;
  }
  const session=await navigator.xr.requestSession("immersive-vr",{
   requiredFeatures:["local-floor"],
   optionalFeatures:["hand-tracking"]
  });
  renderer.xr.setReferenceSpaceType("local-floor");
  await renderer.xr.setSession(session);
  mobileMode=false;
  playerRig.position.set(0,0,0);
  computer.visible=true;
  showMainMenu();
  calibrated=false;
  playerHeight=1.6;
  calibrationAttempts=0;
  document.getElementById("enter").style.display="none";
  document.getElementById("enterVR").style.display="none";
  document.getElementById("mobileControls").style.display="none";
  setStatus("REDLINE ARENA — ENTERING VR");
  session.addEventListener("end",()=>{
   stopRoomListener();
   computer.visible=false;
   mobileMode=false;
   document.getElementById("enter").style.display="block";
   document.getElementById("enterVR").style.display="block";
   document.getElementById("mobileControls").style.display="none";
   controllers.forEach(controller=>controller.userData.connected=false);
   arms.forEach(arm=>setArmVisible(arm,false));
   setStatus("REDLINE ARENA — READY");
  });
 }catch(error){
  console.error("VR error:",error);
  setStatus("VR ERROR: "+error.message);
 }
});

if(navigator.xr){
 navigator.xr.isSessionSupported("immersive-vr").then(supported=>{
  if(supported)document.getElementById("enterVR").style.display="block";
 }).catch(()=>{});
}

// ===================================
// MOBILE TOUCH CONTROLS
// ===================================
const stickBase=document.getElementById("stickBase");
const stickKnob=document.getElementById("stickKnob");
let stickPointer=null;

function setStick(event){
 const rect=stickBase.getBoundingClientRect();
 const cx=rect.left+rect.width/2;
 const cy=rect.top+rect.height/2;
 let dx=event.clientX-cx;
 let dy=event.clientY-cy;
 const max=43;
 const len=Math.hypot(dx,dy);
 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }
 mobileStickX=dx/max;
 mobileStickY=dy/max;
 stickKnob.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetStick(){
 mobileStickX=0;
 mobileStickY=0;
 stickKnob.style.transform="translate(0,0)";
 stickPointer=null;
}
stickBase.addEventListener("pointerdown",event=>{
 stickPointer=event.pointerId;
 stickBase.setPointerCapture(stickPointer);
 setStick(event);
});
stickBase.addEventListener("pointermove",event=>{
 if(event.pointerId===stickPointer)setStick(event);
});
stickBase.addEventListener("pointerup",resetStick);
stickBase.addEventListener("pointercancel",resetStick);

const jumpButton=document.getElementById("jump");
jumpButton.addEventListener("pointerdown",event=>{
 event.preventDefault();
 mobileJumpDown=true;
 jumpButton.setPointerCapture(event.pointerId);
});
function releaseJump(){mobileJumpDown=false;}
jumpButton.addEventListener("pointerup",releaseJump);
jumpButton.addEventListener("pointercancel",releaseJump);
jumpButton.addEventListener("lostpointercapture",releaseJump);

let lookPointer=null;
let lastLookX=0,lastLookY=0;

renderer.domElement.addEventListener("pointerdown",event=>{
 if(!mobileMode||event.clientX<innerWidth*.42)return;
 lookPointer=event.pointerId;
 lastLookX=event.clientX;
 lastLookY=event.clientY;
 renderer.domElement.setPointerCapture(lookPointer);
});
renderer.domElement.addEventListener("pointermove",event=>{
 if(!mobileMode||event.pointerId!==lookPointer)return;
 const dx=event.clientX-lastLookX;
 const dy=event.clientY-lastLookY;
 lastLookX=event.clientX;
 lastLookY=event.clientY;
 mobileYaw-=dx*.004;
 mobilePitch-=dy*.003;
 mobilePitch=THREE.MathUtils.clamp(mobilePitch,-1.15,1.15);
 playerRig.rotation.y=mobileYaw;
 camera.rotation.x=mobilePitch;
});
function endLook(event){
 if(event.pointerId===lookPointer)lookPointer=null;
}
renderer.domElement.addEventListener("pointerup",endLook);
renderer.domElement.addEventListener("pointercancel",endLook);

renderer.domElement.addEventListener("click",event=>{
 if(!mobileMode||!computer.visible)return;
 const rect=renderer.domElement.getBoundingClientRect();
 const pointer=new THREE.Vector2(
  ((event.clientX-rect.left)/rect.width)*2-1,
  -((event.clientY-rect.top)/rect.height)*2+1
 );
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(menuButtons,false);
 if(hits.length&&hits[0].object.userData.action){
  hits[0].object.userData.action();
 }
});

window.addEventListener("keydown",event=>{
 mobileKeys[event.key.toLowerCase()]=true;
});
window.addEventListener("keyup",event=>{
 mobileKeys[event.key.toLowerCase()]=false;
});

// ===================================
// WALKING, JUMPING AND COLLISION
// ===================================
let verticalVelocity=0;
let grounded=true;
let jumpWasDown=false;
const gravity=9.8;
const jumpPower=4.2;
const walkSpeed=2.8;

function isOnShelf(x,z){
 const localX=x-shelf.position.x;
 const localZ=z-shelf.position.z;
 return Math.abs(localX)<shelfWidth/2&&Math.abs(localZ)<shelfDepth/2;
}

function movePlayer(delta){
 if(!renderer.xr.isPresenting&&!mobileMode)return;

 let stickX=mobileMode?mobileStickX:0;
 let stickY=mobileMode?mobileStickY:0;
 let jumpDown=mobileMode?mobileJumpDown:false;

 const session=renderer.xr.getSession();
 if(renderer.xr.isPresenting&&session){
  for(const source of session.inputSources){
   if(!source.gamepad)continue;
   if(source.handedness==="left"){
    const axes=source.gamepad.axes;
    if(axes.length>=2){
     stickX=axes[axes.length-2]||0;
     stickY=axes[axes.length-1]||0;
    }
   }
   if(source.handedness==="right"){
    const buttons=source.gamepad.buttons;
    jumpDown=!!((buttons[4]&&buttons[4].pressed)||(buttons[3]&&buttons[3].pressed));
   }
  }
 }

 if(mobileMode){
  if(mobileKeys["w"]||mobileKeys["arrowup"])stickY=-1;
  if(mobileKeys["s"]||mobileKeys["arrowdown"])stickY=1;
  if(mobileKeys["a"]||mobileKeys["arrowleft"])stickX=-1;
  if(mobileKeys["d"]||mobileKeys["arrowright"])stickX=1;
  if(mobileKeys[" "])jumpDown=true;
 }

 if(Math.abs(stickX)>.15||Math.abs(stickY)>.15){
  const view=renderer.xr.isPresenting?renderer.xr.getCamera(camera):camera;
  const forward=new THREE.Vector3();
  view.getWorldDirection(forward);
  forward.y=0;
  forward.normalize();
  const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();
  playerRig.position.addScaledVector(forward,-stickY*walkSpeed*delta);
  playerRig.position.addScaledVector(right,stickX*walkSpeed*delta);
 }

 if(jumpDown&&!jumpWasDown&&grounded){
  verticalVelocity=jumpPower;
  grounded=false;
 }
 jumpWasDown=jumpDown;

 const oldFeetY=playerRig.position.y;
 verticalVelocity-=gravity*delta;
 playerRig.position.y+=verticalVelocity*delta;

 const view=renderer.xr.isPresenting?renderer.xr.getCamera(camera):camera;
 view.getWorldPosition(headPosition);
 const shelfBounds=isOnShelf(headPosition.x,headPosition.z);

 if(shelfBounds&&oldFeetY>=shelfTop-.02&&playerRig.position.y<=shelfTop&&verticalVelocity<=0){
  playerRig.position.y=shelfTop;
  verticalVelocity=0;
  grounded=true;
 }
 if(playerRig.position.y<=0){
  playerRig.position.y=0;
  verticalVelocity=0;
  grounded=true;
 }
 if(shelfBounds&&Math.abs(playerRig.position.y-shelfTop)<.02&&verticalVelocity<=0){
  playerRig.position.y=shelfTop;
  verticalVelocity=0;
  grounded=true;
 }
}

// ===================================
// BODY AND ARM TRACKING
// ===================================
function updateBody(){
 if(!renderer.xr.isPresenting&&!mobileMode)return;

 const view=renderer.xr.isPresenting?renderer.xr.getCamera(camera):camera;
 view.getWorldPosition(headPosition);

 torso.position.copy(headPosition);
 torso.position.y-=playerHeight*.40;
 torso.scale.set(.86,.72*(playerHeight/1.6),.68);

 head.position.copy(headPosition);
 head.position.y-=.13;

 face.position.copy(head.position);
 face.position.y+=.005;
 face.position.z-=.095;

 chest.position.copy(torso.position);
 chest.position.z-=.18;

 chestLava[0].position.set(torso.position.x-.035,torso.position.y+.01,torso.position.z-.205);
 chestLava[1].position.set(torso.position.x+.035,torso.position.y-.01,torso.position.z-.205);

 if(!renderer.xr.isPresenting){
  arms.forEach(arm=>setArmVisible(arm,false));
  return;
 }

 for(let i=0;i<2;i++){
  const controller=controllers[i];
  const arm=arms[i];

  if(!controller.userData.connected){
   setArmVisible(arm,false);
   continue;
  }

  setArmVisible(arm,true);
  controller.getWorldPosition(handPosition);

  shoulder.copy(headPosition);
  shoulder.x+=(controller.userData.handedness==="left"?-.19:.19);
  shoulder.y-=playerHeight*.22;
  shoulder.z+=.035;

  updateSegment(arm.arm,shoulder,handPosition);
  arm.hand.position.copy(handPosition);

  const direction=new THREE.Vector3().subVectors(handPosition,shoulder);
  const length=direction.length();
  direction.normalize();

  for(let b=0;b<arm.bands.length;b++){
   const fraction=b===0?.32:.7;
   arm.bands[b].position.copy(shoulder).addScaledVector(direction,length*fraction);
   arm.bands[b].quaternion.copy(arm.arm.quaternion);
   arm.bands[b].rotateX(Math.PI/2);
  }
 }
}

// ===================================
// MAIN GAME LOOP
// ===================================
let lastTime=performance.now();
let nearComputer=false;

renderer.setAnimationLoop(()=>{
 const now=performance.now();
 const delta=Math.min((now-lastTime)/1000,.05);
 lastTime=now;

 if(renderer.xr.isPresenting||mobileMode){
  if(renderer.xr.isPresenting&&!calibrated)calibrateHeight();
  movePlayer(delta);
  updateBody();

  if(computer.visible){
   const near=computerDistance()<3.5;
   if(near&&!nearComputer){
    setStatus(mobileMode?"TAP A COMPUTER BUTTON TO SELECT":"COMPUTER READY — AIM AND PRESS TRIGGER");
   }
   if(!near&&nearComputer)setStatus("WALK TO THE COMPUTER");
   nearComputer=near;
  }
 }

 renderer.render(scene,camera);
});

// ===================================
// RESIZE AND FIREBASE ERROR CHECK
// ===================================
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

authReady.catch(error=>console.error("Firebase is not ready:",error));
</script>
