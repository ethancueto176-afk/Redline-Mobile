<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>REDLINE ARENA</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080808;color:white;font-family:Arial}
button{cursor:pointer}
#enter,#enterVR{position:fixed;z-index:10;left:50%;transform:translateX(-50%);padding:18px 30px;border:2px solid white;border-radius:12px;background:#c91430;color:white;font-size:22px;font-weight:bold}
#enter{top:40%}#enterVR{top:52%;display:none;background:#171923}
#status{position:fixed;z-index:8;bottom:12px;width:100%;text-align:center;pointer-events:none;text-shadow:0 2px 5px black;font-weight:bold;padding:0 10px}
#hud{position:fixed;z-index:8;top:12px;left:12px;display:none;background:#111d;padding:10px 14px;border:1px solid #ff263f;border-radius:9px}
#money{color:#ffd84a;font-weight:bold;font-size:18px}
#health{color:#ff5267;margin-top:5px}
#zombieInfo{color:#ffb0b9;margin-top:5px;font-size:12px}
#controls{position:fixed;inset:0;z-index:7;display:none;pointer-events:none}
#stick{position:absolute;left:22px;bottom:25px;width:125px;height:125px;border:3px solid #ffffff88;border-radius:50%;background:#1119;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:37px;top:37px;width:45px;height:45px;border-radius:50%;background:#ff263f;border:2px solid white}
#jump,#fire{position:absolute;right:22px;width:76px;height:76px;border-radius:50%;border:2px solid white;background:#b5122c;color:white;font-weight:bold;pointer-events:auto;touch-action:none}
#jump{bottom:30px}#fire{bottom:120px;background:#e51b35}
#hint{position:absolute;right:10px;bottom:205px;font-size:11px;color:#ddd}
#crosshair{position:fixed;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);z-index:9;display:none;pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 5px #ff1735}
#crosshair:before{width:2px;height:34px;left:16px;top:0}
#crosshair:after{height:2px;width:34px;top:16px;left:0}
#crosshair .ring{position:absolute;inset:7px;border:2px solid #ff263f;border-radius:50%;background:#08080855;box-shadow:0 0 8px #ff1735}
#crosshair .dot{position:absolute;width:4px;height:4px;left:15px;top:15px;border-radius:50%;background:#fff;box-shadow:0 0 5px #ff263f}
</style>
</head>

/* PLAYER PROFILE AND PERSISTENT PURCHASES */
let money=Number(localStorage.getItem("redlineMoney")||0);
let health=100;
let unlockedWeapons=["PISTOL"];
let equippedWeapon="PISTOL";
let baseTurretLevel=0;
let baseShieldLevel=0;

const weaponList=[
 {name:"PISTOL",price:0,damage:25,delay:350},
 {name:"SHOTGUN",price:500,damage:90,delay:750},
 {name:"RAPID BLASTER",price:1000,damage:40,delay:130},
 {name:"ASSAULT RIFLE",price:2000,damage:65,delay:180},
 {name:"SNIPER RIFLE",price:3500,damage:250,delay:950},
 {name:"MINIGUN",price:5000,damage:35,delay:65}
];

function updateHUD(){
 document.getElementById("money").textContent="MONEY: $"+money.toLocaleString();
 document.getElementById("health").textContent="HEALTH: "+health;
}

function savePlayerProfile(){
 localStorage.setItem("redlineMoney",String(money));
 localStorage.setItem("redlineWeapons",JSON.stringify(unlockedWeapons));
 localStorage.setItem("redlineEquipped",equippedWeapon);
 localStorage.setItem("redlineTurrets",String(baseTurretLevel));
 localStorage.setItem("redlineShields",String(baseShieldLevel));

 if(!auth.currentUser)return Promise.resolve();

 const uid=auth.currentUser.uid;
 const data={
  money,unlockedWeapons,equippedWeapon,
  baseTurretLevel,baseShieldLevel,
  updatedAt:serverTimestamp()
 };

 profileSaveQueue=profileSaveQueue
  .then(()=>setDoc(doc(db,"players",uid),data,{merge:true}))
  .catch(e=>console.warn("Profile save failed:",e.message));

 return profileSaveQueue;
}

async function loadPlayerProfile(){
 if(!auth.currentUser)return;
 try{
  const snap=await getDoc(doc(db,"players",auth.currentUser.uid));
  if(snap.exists()){
   const p=snap.data();
   money=Math.max(0,Number(p.money??money));
   unlockedWeapons=Array.isArray(p.unlockedWeapons)?p.unlockedWeapons:["PISTOL"];
   if(!unlockedWeapons.includes("PISTOL"))unlockedWeapons.unshift("PISTOL");
   equippedWeapon=unlockedWeapons.includes(p.equippedWeapon)?p.equippedWeapon:"PISTOL";
   baseTurretLevel=Math.max(0,Number(p.baseTurretLevel)||0);
   baseShieldLevel=Math.max(0,Number(p.baseShieldLevel)||0);
  }else{
   await savePlayerProfile();
  }
  updateHUD();
 }catch(e){
  console.warn("Could not load cloud profile:",e.message);
 }
}

function earnMoney(amount){
 money+=amount;
 savePlayerProfile();
 updateHUD();
}

updateHUD();

function box(w,h,d,color,x,y,z,parent=scene){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:.8})
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

const computer=new THREE.Group();
computer.position.set(0,0,-7);

box(2,1.55,.12,0x111827,0,2.05,-.25,computer);
box(.25,.9,.25,0x17191f,0,1.05,0,computer);

function textTexture(message,color="#ffffff"){
 const c=document.createElement("canvas");
 c.width=1024;c.height=256;
 const x=c.getContext("2d");
 x.fillStyle="#10131c";x.fillRect(0,0,1024,256);
 x.fillStyle=color;x.font="bold 65px Arial";
 x.textAlign="center";x.textBaseline="middle";
 x.fillText(message,512,128);
 const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBColorSpace;
 return t;
}

/* FIREBASE MULTIPLAYER */
function newCode(){return String(Math.floor(1000+Math.random()*9000));}

async function createRoom(visibility,gameType="PVP"){
 try{
  await authReady;
  if(!auth.currentUser)throw Error("PLAYER NOT SIGNED IN");
  status("CREATING ROOM...");
  for(let i=0;i<12;i++){
   const code=newCode(),ref=doc(db,"rooms",code);
   if((await getDoc(ref)).exists())continue;
   await setDoc(ref,{
    code,hostUid:auth.currentUser.uid,
    players:[auth.currentUser.uid],votes:[],
    visibility,status:"open",gameType,
    positions:{},createdAt:serverTimestamp()
   });
   roomCode=code;openRoom(code);return;
  }
  status("COULD NOT CREATE ROOM");
 }catch(e){status("ROOM ERROR: "+e.message);}
}

async function joinRoom(code){
 await authReady;
 if(!auth.currentUser)throw Error("PLAYER NOT SIGNED IN");
 const ref=doc(db,"rooms",code);
 await runTransaction(db,async tx=>{
  const snap=await tx.get(ref);
  if(!snap.exists())throw Error("ROOM NOT FOUND");
  const r=snap.data();
  if(r.status!=="open")throw Error("ROOM ALREADY STARTED");
  const players=Array.isArray(r.players)?r.players:[];
  if(!players.includes(auth.currentUser.uid))players.push(auth.currentUser.uid);
  if(players.length>10)throw Error("ROOM IS FULL");
  tx.update(ref,{players});
 });
 roomCode=code;openRoom(code);
}

async function joinPrivate(){
 const code=prompt("Enter the 4-digit room code:");
 if(!code)return;
 try{await joinRoom(code.trim());}catch(e){status(e.message);}
}

async function joinPublic(){
 try{
  await authReady;
  if(!auth.currentUser)throw Error("PLAYER NOT SIGNED IN");
  status("FINDING PUBLIC PVP SERVER...");
  const snap=await getDocs(collection(db,"rooms"));
  const found=snap.docs.find(d=>{
   const r=d.data();
   return r.visibility==="public"&&r.status==="open"&&
    r.gameType==="PVP"&&(r.players||[]).length<10;
  });
  if(found)await joinRoom(found.id);
  else await createRoom("public","PVP");
 }catch(e){status("PUBLIC SERVER ERROR: "+e.message);}
}

function openRoom(code){
 if(roomStop)roomStop();
 clearButtons();mode="WAITING";
 screenText("ROOM CODE: "+code);
 addButton("START MATCH",1.35,startMatch);
 addButton("LEAVE ROOM",1.0,leaveRoom);
 roomStop=onSnapshot(doc(db,"rooms",code),s=>{
  if(!s.exists()){status("ROOM CLOSED");return;}
  const r=s.data();
  if(r.status==="started"){
   if(r.gameType==="ZOMBIE")beginZombieFriends();
   else beginPvp();
  }else status("ROOM "+code+" — "+(r.players||[]).length+" PLAYER(S)");
 },e=>status("ROOM SYNC ERROR: "+e.message));
}

async function startMatch(){
 try{
  const ref=doc(db,"rooms",roomCode);
  await runTransaction(db,async tx=>{
   const s=await tx.get(ref);
   if(!s.exists())throw Error("ROOM NOT FOUND");
   const r=s.data(),players=r.players||[],votes=r.votes||[];
   if(!votes.includes(auth.currentUser.uid))votes.push(auth.currentUser.uid);
   tx.update(ref,{
    votes,status:players.length>0&&players.every(p=>votes.includes(p))?"started":"open"
   });
  });
  status("VOTE SENT — WAITING FOR PLAYERS");
 }catch(e){status("START ERROR: "+e.message);}
}

async function leaveRoom(){
 if(roomStop){roomStop();roomStop=null;}
 if(syncStop){syncStop();syncStop=null;}
 stopZombieMode();
 const code=roomCode;roomCode="";
 try{
  if(code&&auth.currentUser){
   const ref=doc(db,"rooms",code);
   await runTransaction(db,async tx=>{
    const s=await tx.get(ref);if(!s.exists())return;
    const r=s.data();
    const players=(r.players||[]).filter(p=>p!==auth.currentUser.uid);
    const votes=(r.votes||[]).filter(p=>p!==auth.currentUser.uid);
    tx.update(ref,{
     players,votes,status:players.length?"open":"closed",
     hostUid:r.hostUid===auth.currentUser.uid?(players[0]||""):r.hostUid
    });
   });
  }
 }catch(e){console.warn(e);}
 showMenu();
}

function beginPvp(){
 if(mode==="PVP")return;
 mode="PVP";clearButtons();screenText("PVP MATCH");
 status("PVP MATCH — FIRE TO SHOOT");
 const ref=doc(db,"rooms",roomCode);
 if(syncStop)syncStop();
 syncStop=onSnapshot(ref,s=>{
  if(!s.exists())return;
  remotePlayers=s.data().positions||{};
  updateRemotePlayers();
 });
}

/* PLAYER AVATAR */
const black=new THREE.MeshStandardMaterial({color:0x08090c});
const lava=new THREE.MeshStandardMaterial({

});
const torso=new THREE.Mesh(new THREE.SphereGeometry(.28,20,16),black);
torso.scale.set(.86,.72,.68);scene.add(torso);

function segment(mesh,a,b){
 const d=new THREE.Vector3().subVectors(b,a);
 mesh.position.copy(a).add(b).multiplyScalar(.5);
 mesh.scale.y=d.length();
 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
}

/* BOSS BATTLE */
let boss=null,bossHP=0,bossMax=0,bossRewarded=false;
let bossElapsed=0,bossAttackTimer=0,bossWarning=0,bossAttackCount=0;
let bossProjectiles=[],bossPhase=1,lastPlayerShot=0;
const bossProjectileGeometry=new THREE.SphereGeometry(.16,12,10);
const bossProjectileMaterial=new THREE.MeshStandardMaterial({
 color:0xff1838,emissive:0xff001e,emissiveIntensity:2
});

function clearBossProjectiles(){
 for(const p of bossProjectiles)scene.remove(p.mesh);
 bossProjectiles.length=0;
}

function startBoss(){
 stopZombieMode();
 clearButtons();mode="BOSS";
 health=100;updateHUD();
 bossHP=1500;bossMax=1500;bossRewarded=false;
 bossElapsed=0;bossAttackTimer=.7;bossWarning=0;
 bossAttackCount=0;bossPhase=1;lastPlayerShot=0;
 clearBossProjectiles();
 rig.position.set(0,0,-4.4);
 screenText("BOSS BATTLE");
 status("BOSS BATTLE — DODGE THE RED BLASTS!");
 if(boss)scene.remove(boss);
 boss=new THREE.Group();boss.position.set(0,1,-7);scene.add(boss);
 const mat=new THREE.MeshStandardMaterial({color:0x300710,emissive:0x8b0018,emissiveIntensity:.7});
 const body=new THREE.Mesh(new THREE.SphereGeometry(.8,24,20),mat);
 body.scale.y=1.3;boss.add(body);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.48,20,16),mat);
 h.position.y=1.1;boss.add(h);
 for(let i=0;i<2;i++){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.08,12,12),lava);
  eye.position.set(i?.2:-.2,1.15,-.42);boss.add(eye);
 }
 const core=new THREE.Mesh(new THREE.SphereGeometry(.23,16,12),lava);
 core.position.set(0,.15,-.72);boss.add(core);
}

function damageBoss(){
 if(mode!=="BOSS"||!boss||bossHP<=0)return;
 const now=performance.now();
 if(now-lastPlayerShot<160)return;
 lastPlayerShot=now;bossHP=Math.max(0,bossHP-15);
 status("BOSS HEALTH: "+bossHP+"/"+bossMax+" — YOUR HEALTH: "+health);
 if(bossHP<=bossMax*.5&&bossPhase===1){
  bossPhase=2;status("BOSS ENRAGED! KEEP MOVING!");
  if(boss.children[0]?.material)boss.children[0].material.emissiveIntensity=1.5;
 }
 if(bossHP===0&&!bossRewarded){
  bossRewarded=true;mode="BOSS_WON";clearBossProjectiles();
  earnMoney(5000);screenText("BOSS DEFEATED!");
  status("BOSS DEFEATED! YOU EARNED $5,000!");
  scene.remove(boss);boss=null;
  addButton("FIGHT AGAIN",1.0,startBoss);
  addButton("BACK TO MENU",.65,showMenu);
 }
}

function fireBossProjectile(offset=0){
 if(!boss)return;
 const origin=boss.localToWorld(new THREE.Vector3(0,1.1,-.2));
 const target=new THREE.Vector3();camera.getWorldPosition(target);
 const direction=target.sub(origin).normalize();
 if(offset)direction.applyAxisAngle(new THREE.Vector3(0,1,0),offset).normalize();
 const mesh=new THREE.Mesh(bossProjectileGeometry,bossProjectileMaterial);
 mesh.position.copy(origin);scene.add(mesh);
 bossProjectiles.push({mesh,velocity:direction.multiplyScalar(bossPhase===2?6.6:5.5),damage:bossPhase===2?21:16,life:5});
}

function updateBossFight(dt){
 if(mode!=="BOSS"||!boss)return;
 bossElapsed+=dt;
 boss.rotation.y=Math.sin(bossElapsed*1.4)*.16;
 boss.position.y=1+Math.sin(bossElapsed*2.2)*.08;
 if(bossWarning>0){
  bossWarning-=dt;
  if(bossWarning<=0){
   bossAttackCount++;
   if(bossAttackCount%3===0){
    fireBossProjectile(-.22);fireBossProjectile(0);fireBossProjectile(.22);
   }else fireBossProjectile();
   bossAttackTimer=bossPhase===2?1.25:(bossElapsed<60?1.65:2.05);
  }
 }else if((bossAttackTimer-=dt)<=0){
  bossWarning=.48;status(bossPhase===2?"BOSS ENRAGED — DODGE NOW!":"BOSS IS CHARGING — MOVE NOW!");
 }
 const player=new THREE.Vector3();camera.getWorldPosition(player);
 for(let i=bossProjectiles.length-1;i>=0;i--){
  const p=bossProjectiles[i];
  p.mesh.position.addScaledVector(p.velocity,dt);p.life-=dt;
  if(p.mesh.position.distanceTo(player)<.48){
   health=Math.max(0,health-p.damage);updateHUD();
   scene.remove(p.mesh);bossProjectiles.splice(i,1);
   status("HIT! HEALTH: "+health+" — KEEP DODGING!");
   if(health<=0){
    mode="BOSS_LOST";clearBossProjectiles();screenText("YOU WERE DEFEATED");
    status("BOSS WON THIS ROUND — TRY AGAIN OR RETURN TO MENU");
    if(boss){scene.remove(boss);boss=null;}
    addButton("RETRY BOSS",1.0,startBoss);
    addButton("BACK TO MENU",.65,showMenu);return;

const BASE={minX:-7.5,maxX:7.5,minZ:-48,maxZ:-29};
const BASE_DOOR_WIDTH=3;

function insideBase(x,z,padding=0){
 return x>BASE.minX-padding&&x<BASE.maxX+padding&&
  z>BASE.minZ-padding&&z<BASE.maxZ+padding;
}

function zombieKillsRequired(level){return 50*Math.pow(2,level-1);}
function zombieReward(level){return 25+5*(level-1);}
function zombieDamage(level){return 25*Math.pow(2,level-1);}

function zombieDifficulty(level){
 if(level<=1)return {speed:.48,attackDelay:3.5,hp:50,spawnDelay:2.6};
 if(level===2)return {speed:.58,attackDelay:3.1,hp:65,spawnDelay:2.4};
 if(level===3)return {speed:.68,attackDelay:2.8,hp:80,spawnDelay:2.2};
 return {
  speed:.8+(level-4)*.18,
  attackDelay:Math.max(.8,2.2-(level-4)*.15),
  hp:100+(level-4)*35,
  spawnDelay:Math.max(.55,1.9-(level-4)*.1)
 };
}

function chooseZombieSpawn(){
 /* Spawn around the outside of the headquarters, never inside it. */
 for(let tries=0;tries<80;tries++){
  const side=Math.floor(Math.random()*4);
  let x,z;
  if(side===0){x=BASE.minX-2-Math.random()*12;z=BASE.minZ+Math.random()*(BASE.maxZ-BASE.minZ);}
  if(side===1){x=BASE.maxX+2+Math.random()*12;z=BASE.minZ+Math.random()*(BASE.maxZ-BASE.minZ);}
  if(side===2){x=BASE.minX+Math.random()*(BASE.maxX-BASE.minX);z=BASE.minZ-2-Math.random()*12;}
  if(side===3){x=BASE.minX+Math.random()*(BASE.maxX-BASE.minX);z=BASE.maxZ+2+Math.random()*12;}

  x=THREE.MathUtils.clamp(x,ARENA.minX+2,ARENA.maxX-2);
  z=THREE.MathUtils.clamp(z,ARENA.minZ+2,ARENA.maxZ-2);
  if(!insideBase(x,z,1))return {x,z};
 }
 return {x:BASE.maxX+5,z:-38};
}

function fireZombieBossProjectile(offset=0){
 if(!zombieBoss||!zombieBossActive)return;
 const origin=zombieBoss.localToWorld(new THREE.Vector3(0,2.2,-.5));
 const target=new THREE.Vector3();camera.getWorldPosition(target);
 const direction=target.sub(origin).normalize();
 if(offset)direction.applyAxisAngle(new THREE.Vector3(0,1,0),offset).normalize();

 const mesh=new THREE.Mesh(zombieBossProjectileGeometry,zombieBossProjectileMaterial);
 mesh.position.copy(origin);scene.add(mesh);
 zombieBossProjectiles.push({
  mesh,velocity:direction.multiplyScalar(7+Math.min(zombieBossIndex,10)*.25),
  damage:Math.min(250,25+zombieBossIndex*10),life:6
 });

 zombieBossActive=false;

 clearZombieBossProjectiles();
 earnMoney(reward);

 zombieBossIndex++;
 zombieBossNextLevel*=2;
 health=100;updateHUD();
 screenText("BOSS DEFEATED!");
 status("BOSS DEFEATED! +$"+reward+" — NEXT BOSS AT LEVEL "+zombieBossNextLevel);

function updateZombieBoss(dt){
 if(!zombieBossActive||!zombieBoss)return;
 zombieBossElapsed+=dt;
 zombieBoss.rotation.y=Math.sin(zombieBossElapsed*1.2)*.18;
 zombieBoss.position.y=Math.sin(zombieBossElapsed*2)*.12;

 if(zombieBossWarning>0){
  zombieBossWarning-=dt;
  if(zombieBossWarning<=0){
   zombieBossAttackCount++;
   if(zombieBossAttackCount%3===0){
    fireZombieBossProjectile(-.25);
    fireZombieBossProjectile(0);
    fireZombieBossProjectile(.25);
   }else fireZombieBossProjectile();
   zombieBossAttackTimer=Math.max(.65,2.2-zombieBossIndex*.08);
  }
 }else if((zombieBossAttackTimer-=dt)<=0){
  zombieBossWarning=.65;status("BOSS IS CHARGING AN ATTACK — DODGE!");
 }

 const player=new THREE.Vector3();camera.getWorldPosition(player);
 for(let i=zombieBossProjectiles.length-1;i>=0;i--){
  const p=zombieBossProjectiles[i];
  p.mesh.position.addScaledVector(p.velocity,dt);p.life-=dt;
  if(p.mesh.position.distanceTo(player)<.55){
   let damage=p.damage;
   if(insideBase(player.x,player.z)&&baseShieldLevel>0)damage=Math.ceil(damage/(1+baseShieldLevel));
   health=Math.max(0,health-damage);updateHUD();
   scene.remove(p.mesh);zombieBossProjectiles.splice(i,1);
   status("BOSS BLAST HIT YOU FOR "+damage+" DAMAGE! HEALTH: "+health);
   if(health<=0){endZombieGame();return;}
  }else if(p.life<=0||p.mesh.position.distanceTo(player)>40){
   scene.remove(p.mesh);zombieBossProjectiles.splice(i,1);
  }
 }
}

 if(unlockedWeapons.includes(name)){

 }

 const previous=weaponList[index-1];
 if(index>0&&!unlockedWeapons.includes(previous.name)){
  status("BUY "+previous.name+" FIRST — WEAPONS MUST BE UNLOCKED IN ORDER");

 const weapon=weaponList[index];

 status(name+" PURCHASED AND EQUIPPED!");

 if(zombieGameOver)return;
 const now=performance.now();
 if(now-zombieLastShot<zombieFireDelay)return;
 zombieLastShot=now;
 camera.updateMatrixWorld(true);
 zombieRaycaster.setFromCamera(new THREE.Vector2(0,0),camera);

 if(zombieBossActive&&zombieBoss){
  const hits=zombieRaycaster.intersectObjects(zombieBoss.children,false);
  if(hits.length){
   zombieBossHP=Math.max(0,zombieBossHP-zombieWeaponDamage);
   if(zombieBossHP<=0)defeatZombieBoss();
   else{
    status("BOSS HIT! "+Math.ceil(zombieBossHP)+" / "+zombieBossMaxHP+" HP");
    updateZombieHUD();
   }
   return;
  }
 }

 const targets=[];
 for(const z of zombies)for(const child of z.group.children)targets.push(child);
 const hits=zombieRaycaster.intersectObjects(targets,false);
 if(!hits.length){status(zombieWeapon+" FIRED — NO TARGET HIT");return;}

 const target=hits[0].object;
 const index=zombies.findIndex(z=>z.group.children.includes(target));
 if(index<0)return;
 zombies[index].hp-=zombieWeaponDamage;
 if(zombies[index].hp<=0)killZombie(index);
 else status("ZOMBIE HIT! "+Math.ceil(zombies[index].hp)+" HP LEFT");
}

function endZombieGame(){
 if(zombieGameOver)return;
 document.getElementById("crosshair").style.display="none";
 zombieGameOver=true;zombieBossActive=false;
 clearZombies();clearZombieBossProjectiles();
 if(zombieBoss){scene.remove(zombieBoss);zombieBoss=null;}
 clearButtons();screenText("YOU WERE DEFEATED");
 status("YOU WERE DEFEATED ON LEVEL "+zombieLevel);
 addButton("TRY AGAIN",1.0,()=>startZombieMode(zombieFriends));
 addButton("WEAPON SHOP",.65,showZombieShop);
 addButton("BACK TO MENU",.3,showMenu);
}

/* AUTOMATIC BASE TURRETS */
function updateTurrets(dt){
 if(mode!=="ZOMBIE"&&mode!=="ZOMBIE_FRIENDS")return;
 if(zombieGameOver||baseTurretLevel<=0)return;

 turretFireTimer-=dt;
 if(turretFireTimer>0)return;
 turretFireTimer=Math.max(.18,.9-baseTurretLevel*.15);

 for(const turret of turretObjects){
  if(!turret.visible)continue;
  let target=null,best=Infinity;
  for(const z of zombies){
   const d=turret.position.distanceTo(z.group.position);
   if(d<best&&d<22){best=d;target=z;}
  }
  if(!target)continue;

  const direction=new THREE.Vector3().subVectors(target.group.position,turret.position);
  direction.y=0;
  turret.rotation.y=Math.atan2(direction.x,direction.z);

  /* Turrets automatically damage the closest zombie. */
  target.hp-=12*baseTurretLevel;
  if(target.hp<=0){
   const index=zombies.indexOf(target);
   if(index>=0)killZombie(index);
  }
 }
}

/* ZOMBIE MOVEMENT AND BASE COLLISION */
function updateZombies(dt){
 if(mode!=="ZOMBIE"&&mode!=="ZOMBIE_FRIENDS")return;
 if(zombieGameOver)return;

 if(zombieBossActive){updateZombieBoss(dt);return;}

 zombieSpawnTimer-=dt;
 const maxAlive=Math.min(8+zombieLevel*2,24);
 if(zombieSpawnTimer<=0&&zombies.length<maxAlive){
  spawnZombie();
  zombieSpawnTimer=zombieDifficulty(zombieLevel).spawnDelay;
 }

 const player=new THREE.Vector3();
 camera.getWorldPosition(player);

 for(let i=zombies.length-1;i>=0;i--){
  const z=zombies[i],group=z.group;
  const dx=player.x-group.position.x,dz=player.z-group.position.z;
  const distance=Math.hypot(dx,dz);

  if(distance>.001){
   const direction=new THREE.Vector3(dx,0,dz).normalize();
   let nextX=group.position.x+direction.x*z.speed*dt;
   let nextZ=group.position.z+direction.z*z.speed*dt;

   /* The headquarters perimeter is impassable to zombies. */
   if(insideBase(nextX,nextZ)){
    const oldInside=insideBase(group.position.x,group.position.z);
    if(!oldInside){
     const cx=THREE.MathUtils.clamp(nextX,BASE.minX-.65,BASE.maxX+.65);
     const cz=THREE.MathUtils.clamp(nextZ,BASE.minZ-.65,BASE.maxZ+.65);
     const dxEdge=Math.abs(nextX-cx),dzEdge=Math.abs(nextZ-cz);
     if(dxEdge<dzEdge)nextX=group.position.x;
     else nextZ=group.position.z;
    }
   }

   /* Extra safety: zombies are never allowed inside the safe-zone volume. */
   if(!insideBase(nextX,nextZ,.05)){
    group.position.x=THREE.MathUtils.clamp(nextX,ARENA.minX+1,ARENA.maxX-1);
    group.position.z=THREE.MathUtils.clamp(nextZ,ARENA.minZ+1,ARENA.maxZ-1);
   }

   group.rotation.y=Math.atan2(direction.x,direction.z);
  }

  z.phase+=dt*5;
  z.legs.forEach((leg,j)=>leg.rotation.x=Math.sin(z.phase+j*Math.PI)*.45);

  z.attackTimer-=dt;
  if(distance<1.25&&z.attackTimer<=0){
   let damage=zombieDamage(zombieLevel);
   if(insideBase(player.x,player.z)){
    /* The base shield reduces damage while the player is inside HQ. */
    if(baseShieldLevel>0)damage=Math.ceil(damage/(1+baseShieldLevel));
    else damage=0;
   }
   if(damage>0){
    health=Math.max(0,health-damage);updateHUD();
    status("ZOMBIE HIT YOU FOR "+damage+" DAMAGE! HEALTH: "+health);
   }else{
    status("HEADQUARTERS SHIELD BLOCKED THE ATTACK!");
   }
   z.attackTimer=z.attackDelay;
   if(health<=0){endZombieGame();return;}
  }
 }
}

/* SHOOTING */
function shoot(){
 if(mode==="BOSS"){damageBoss();return;}
 if(mode==="ZOMBIE"||mode==="ZOMBIE_FRIENDS"){shootZombie();return;}
 if(mode!=="PVP")return;
 status("PVP SHOT FIRED");
}
document.getElementById("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();shoot();
});

/* VR CONTROLLERS */
const controllers=[];
for(let i=0;i<2;i++){
 const c=renderer.xr.getController(i);
 c.addEventListener("select",shoot);
 rig.add(c);controllers.push(c);
}

document.getElementById("enterVR").onclick=async()=>{
 try{
  const session=await navigator.xr.requestSession("immersive-vr",{
   optionalFeatures:["local-floor","hand-tracking"]
  });

  computer.visible=true;showMenu();
  document.getElementById("enter").style.display="none";
  document.getElementById("enterVR").style.display="none";

   document.getElementById("enter").style.display="block";
   document.getElementById("enterVR").style.display="block";
   document.getElementById("hud").style.display="none";
   computer.visible=false;
  });
 }catch(e){status("VR ERROR: "+e.message);}

if(navigator.xr){
 navigator.xr.isSessionSupported("immersive-vr").then(ok=>{
  if(ok)document.getElementById("enterVR").style.display="block";
 }).catch(()=>{});
}

/* MOBILE GAME */
let mobile=false,yaw=0,pitch=0;
document.getElementById("enter").onclick=()=>{
 mobile=true;
 rig.position.set(0,0,-4.4);
 computer.visible=true;showMenu();
 document.getElementById("enter").style.display="none";
 document.getElementById("enterVR").style.display="none";
 document.getElementById("controls").style.display="block";
 document.getElementById("hud").style.display="block";
 status("REDLINE ARENA — MOBILE READY");
};

/* COMPUTER BUTTON TOUCH */
const menuRaycaster=new THREE.Raycaster();
const menuPointer=new THREE.Vector2();

function selectComputerButton(clientX,clientY){
 if(!computer.visible||buttons.length===0)return false;
 const rect=renderer.domElement.getBoundingClientRect();
 if(rect.width===0||rect.height===0)return false;
 menuPointer.x=((clientX-rect.left)/rect.width)*2-1;
 menuPointer.y=-((clientY-rect.top)/rect.height)*2+1;
 camera.updateMatrixWorld(true);computer.updateMatrixWorld(true);
 menuRaycaster.setFromCamera(menuPointer,camera);
 menuRaycaster.near=0;menuRaycaster.far=30;
 const hits=menuRaycaster.intersectObjects(buttons,false);
 if(!hits.length)return false;
 const action=hits[0].object.userData.action;
 if(typeof action==="function"){action();return true;}
 return false;
}

function updateRemotePlayers(){
 /* Remote avatar rendering is not implemented yet. */
 for(const [uid,pos] of Object.entries(remotePlayers)){
  if(uid===auth.currentUser?.uid)continue;
  if(!pos||!Array.isArray(pos))continue;
 }
}

/* MOBILE JOYSTICK */
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
let sx=0,sy=0,pointer=null;

function moveStick(e){
 const r=stick.getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let x=e.clientX-cx,y=e.clientY-cy;
 let l=Math.hypot(x,y),max=42;
 if(l>max){x=x/l*max;y=y/l*max;}
 sx=x/max;sy=y/max;
 knob.style.transform=`translate(${x}px,${y}px)`;
}

stick.onpointerdown=e=>{
 pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e);
};
stick.onpointermove=e=>{if(e.pointerId===pointer)moveStick(e);};
function resetStick(){sx=0;sy=0;pointer=null;knob.style.transform="translate(0,0)";}
stick.onpointerup=resetStick;
stick.onpointercancel=resetStick;

let jump=false,vy=0,grounded=true;
document.getElementById("jump").onpointerdown=e=>{e.preventDefault();jump=true;};
document.getElementById("jump").onpointerup=()=>jump=false;
document.getElementById("jump").onpointercancel=()=>jump=false;

let lookId=null,lx=0,ly=0;
renderer.domElement.addEventListener("pointerdown",e=>{
 if(!mobile||!computer.visible)return;
 if(selectComputerButton(e.clientX,e.clientY)){
  e.preventDefault();e.stopPropagation();return;
 }
 if(e.clientX<innerWidth*.42)return;
 lookId=e.pointerId;lx=e.clientX;ly=e.clientY;
 try{renderer.domElement.setPointerCapture(lookId);}catch(_){}
});

renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookId)return;
 yaw-=(e.clientX-lx)*.004;
 pitch-=(e.clientY-ly)*.003;
 pitch=THREE.MathUtils.clamp(pitch,-1.1,1.1);
 lx=e.clientX;ly=e.clientY;
 rig.rotation.y=yaw;camera.rotation.x=pitch;
});

function stopLook(e){if(e.pointerId===lookId)lookId=null;}
renderer.domElement.addEventListener("pointerup",stopLook);
renderer.domElement.addEventListener("pointercancel",stopLook);

/* PLAYER MOVEMENT */
const clock=new THREE.Clock();
let previousSync=0;

function updatePlayer(dt){
 if(!mobile&&!renderer.xr.isPresenting)return;
 const forward=new THREE.Vector3();
 camera.getWorldDirection(forward);forward.y=0;forward.normalize();
 const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();

 rig.position.addScaledVector(forward,-sy*2.8*dt);
 rig.position.addScaledVector(right,sx*2.8*dt);

 if(jump&&grounded){vy=4.2;grounded=false;}
 vy-=9.8*dt;rig.position.y+=vy*dt;
 if(rig.position.y<=0){rig.position.y=0;vy=0;grounded=true;}

 if(mode==="ZOMBIE"||mode==="ZOMBIE_FRIENDS"){
  rig.position.x=THREE.MathUtils.clamp(rig.position.x,-27,27);
  rig.position.z=THREE.MathUtils.clamp(rig.position.z,-82,-28);
  /* Player can enter and leave HQ through the front opening. */
 }

 camera.getWorldPosition(head.position);
 torso.position.copy(head.position);torso.position.y-=.65;

 for(let i=0;i<2;i++){
  const side=i===0?-1:1;
  const shoulder=new THREE.Vector3(head.position.x+side*.2,head.position.y-.35,head.position.z);
  const hand=new THREE.Vector3(head.position.x+side*.5,head.position.y-.7,head.position.z-.3);
  segment(arms[i].arm,shoulder,hand);
  arms[i].hand.position.copy(hand);
  arms[i].band.position.copy(shoulder).lerp(hand,.7);
 }
}

/* BASIC PVP POSITION UPDATES */
async function syncPosition(){
 if(mode!=="PVP"||!roomCode||!auth.currentUser)return;
 const now=performance.now();
 if(now-previousSync<500)return;
 previousSync=now;
 try{
  const ref=doc(db,"rooms",roomCode);
  const positions={...remotePlayers};
  positions[auth.currentUser.uid]=[
   Number(rig.position.x.toFixed(2)),
   Number(rig.position.y.toFixed(2)),
   Number(rig.position.z.toFixed(2))
  ];
  await updateDoc(ref,{positions});
 }catch(e){console.warn("Position sync:",e.message);}
}

/* CLEAN UP ZOMBIE MODE */
function stopZombieMode(){
 clearZombies();
 zombieGameOver=true;
 zombieBossActive=false;
 if(zombieBoss){scene.remove(zombieBoss);zombieBoss=null;}
 clearZombieBossProjectiles();
 for(const o of zombieArenaObjects)scene.remove(o);
 zombieArenaObjects.length=0;
 for(const o of baseObjects)scene.remove(o);
 baseObjects.length=0;
 for(const t of turretObjects)scene.remove(t);
 turretObjects.length=0;
 shieldMesh=null;
 if(mode==="ZOMBIE"||mode==="ZOMBIE_FRIENDS"||mode==="ZOMBIE_LOST"){
  computer.position.set(0,0,-7);
 }
}

/* GAME LOOP */
renderer.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.05);
 if(mobile||renderer.xr.isPresenting){
  updatePlayer(dt);
  syncPosition();
 }
 if(boss)updateBossFight(dt);
 updateZombies(dt);
 updateTurrets(dt);
 renderer.render(scene,camera);
});

/* RESIZE */
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

/* INITIAL PROFILE LOAD */
authReady.then(()=>{
 if(ready){
  updateHUD();
  if(mode==="MENU"&&balancePanel){
   /* Refresh the menu balance display after cloud profile loads. */
   showMenu();
  }
 }
});
</script>
