/* FIREBASE MULTIPLAYER ROOMS */
function newCode(){
 return String(Math.floor(1000+Math.random()*9000));
}

async function createRoom(visibility,gameType="PVP"){
 try{
  await authReady;
  if(!auth.currentUser)throw Error("PLAYER NOT SIGNED IN");

  status("CREATING ROOM...");

  for(let i=0;i<12;i++){
   const code=newCode();
   const ref=doc(db,"rooms",code);

   if((await getDoc(ref)).exists())continue;

   await setDoc(ref,{
    code,
    hostUid:auth.currentUser.uid,
    players:[auth.currentUser.uid],
    votes:[],
    visibility,
    status:"open",
    gameType,
    positions:{},
    createdAt:serverTimestamp()
   });

   roomCode=code;
   openRoom(code);
   return;
  }

  status("COULD NOT CREATE ROOM");
 }catch(e){
  status("ROOM ERROR: "+e.message);
 }
}

async function joinRoom(code){
 await authReady;
 if(!auth.currentUser)throw Error("PLAYER NOT SIGNED IN");

 const ref=doc(db,"rooms",code);

 await runTransaction(db,async tx=>{
  const snap=await tx.get(ref);
  if(!snap.exists())throw Error("ROOM NOT FOUND");

  const r=snap.data();
  if(r.status!=="open")throw Error("ROOM ALREADY STARTED");

  const players=Array.isArray(r.players)?r.players:[];

  if(!players.includes(auth.currentUser.uid)){
   players.push(auth.currentUser.uid);
  }

  if(players.length>10)throw Error("ROOM IS FULL");

  tx.update(ref,{players});
 });

 roomCode=code;
 openRoom(code);
}

async function joinPrivate(){
 const code=prompt("Enter the 4-digit room code:");
 if(!code)return;

 try{
  await joinRoom(code.trim());
 }catch(e){
  status(e.message);
 }
}

async function joinPublic(){
 try{
  await authReady;
  if(!auth.currentUser)throw Error("PLAYER NOT SIGNED IN");

  status("FINDING PUBLIC PVP SERVER...");

  const snap=await getDocs(collection(db,"rooms"));

  const found=snap.docs.find(d=>{
   const r=d.data();
   return r.visibility==="public"&&
    r.status==="open"&&
    r.gameType==="PVP"&&
    (r.players||[]).length<10;
  });

  if(found){
   await joinRoom(found.id);
  }else{
   await createRoom("public","PVP");
  }
 }catch(e){
  status("PUBLIC SERVER ERROR: "+e.message);
 }
}

function openRoom(code){
 if(roomStop)roomStop();

 clearButtons();
 mode="WAITING";
 screenText("ROOM CODE: "+code);

 addButton("START MATCH",1.35,startMatch);
 addButton("LEAVE ROOM",1.0,leaveRoom);

 const ref=doc(db,"rooms",code);

 roomStop=onSnapshot(ref,s=>{
  if(!s.exists()){
   status("ROOM CLOSED");
   return;
  }

  const r=s.data();

  if(r.status==="started"){
   beginPvp();
  }else{
   status("ROOM "+code+" — "+(r.players||[]).length+" PLAYER(S)");
  }
 },e=>{
  status("ROOM SYNC ERROR: "+e.message);
 });
}

async function startMatch(){
 try{
  const ref=doc(db,"rooms",roomCode);

  await runTransaction(db,async tx=>{
   const s=await tx.get(ref);
   if(!s.exists())throw Error("ROOM NOT FOUND");

   const r=s.data();
   const players=r.players||[];
   const votes=r.votes||[];

   if(!votes.includes(auth.currentUser.uid)){
    votes.push(auth.currentUser.uid);
   }

   tx.update(ref,{
    votes,
    status:players.length>0&&
     players.every(p=>votes.includes(p))?"started":"open"
   });
  });

  status("VOTE SENT — WAITING FOR PLAYERS");
 }catch(e){
  status("START ERROR: "+e.message);
 }
}

async function leaveRoom(){
 if(roomStop){roomStop();roomStop=null;}
 if(syncStop){syncStop();syncStop=null;}

 const code=roomCode;
 roomCode="";

 try{
  if(code&&auth.currentUser){
   const ref=doc(db,"rooms",code);

   await runTransaction(db,async tx=>{
    const s=await tx.get(ref);
    if(!s.exists())return;

    const r=s.data();

    const players=(r.players||[]).filter(
     p=>p!==auth.currentUser.uid
    );
    const votes=(r.votes||[]).filter(
     p=>p!==auth.currentUser.uid
    );

    tx.update(ref,{
     players,
     votes,
     status:players.length?"open":"closed",
     hostUid:r.hostUid===auth.currentUser.uid?
      (players[0]||""):r.hostUid
    });
   });
  }
 }catch(e){
  console.warn(e);
 }

 showMenu();
}

function segment(mesh,a,b){
 const d=new THREE.Vector3().subVectors(b,a);
 mesh.position.copy(a).add(b).multiplyScalar(.5);
 mesh.scale.y=d.length();
 mesh.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,1,0),
  d.normalize()
 );
}

/* BOSS BATTLE — TOUGH BUT PLAYABLE */
let boss=null;
let bossHP=0;
let bossMax=0;
let bossRewarded=false;
let bossElapsed=0;
let bossAttackTimer=0;
let bossWarning=0;
let bossAttackCount=0;
let bossProjectiles=[];
let bossPhase=1;
let lastPlayerShot=0;

const bossProjectileGeometry=new THREE.SphereGeometry(.16,12,10);

const bossProjectileMaterial=new THREE.MeshStandardMaterial({

 if(boss)scene.remove(boss);

 boss=new THREE.Group();

 const bossMat=new THREE.MeshStandardMaterial({
  color:0x300710,
  emissive:0x8b0018,
  emissiveIntensity:.7
 });

 const body=new THREE.Mesh(
  new THREE.SphereGeometry(.8,24,20),
  bossMat
 );
 body.scale.y=1.3;
 boss.add(body);

 const bossHead=new THREE.Mesh(
  new THREE.SphereGeometry(.48,20,16),
  bossMat
 );
 bossHead.position.y=1.1;
 boss.add(bossHead);

 for(let i=0;i<2;i++){
  const eye=new THREE.Mesh(
   new THREE.SphereGeometry(.08,12,12),
   lava
  );
  eye.position.set(i?.2:-.2,1.15,-.42);
  boss.add(eye);
 }

 const core=new THREE.Mesh(
  new THREE.SphereGeometry(.23,16,12),
  lava
 );
 core.position.set(0,.15,-.72);
 boss.add(core);
}

function damageBoss(){
 if(mode!=="BOSS"||!boss||bossHP<=0)return;

 const now=performance.now();
 if(now-lastPlayerShot<160)return;

 lastPlayerShot=now;
 bossHP=Math.max(0,bossHP-15);

 status(
  "BOSS HEALTH: "+bossHP+"/"+bossMax+
  " — YOUR HEALTH: "+health
 );

 if(bossHP<=bossMax*.5&&bossPhase===1){
  bossPhase=2;
  status("BOSS ENRAGED! KEEP MOVING!");

  if(boss.children[0]?.material){
   boss.children[0].material.emissiveIntensity=1.5;
  }
 }

 if(bossHP===0&&!bossRewarded){
  bossRewarded=true;
  mode="BOSS_WON";

  clearBossProjectiles();
  earnMoney(5000);

  screenText("BOSS DEFEATED!");
  status("BOSS DEFEATED! YOU EARNED $5,000!");

  scene.remove(boss);
  boss=null;

  addButton("FIGHT AGAIN",1.0,startBoss);
  addButton("BACK TO MENU",.65,showMenu);
 }
}

function fireBossProjectile(targetOffset=0){
 if(!boss)return;

 const origin=boss.localToWorld(
  new THREE.Vector3(0,1.1,-.2)
 );

 const target=new THREE.Vector3();
 camera.getWorldPosition(target);

 const direction=target.sub(origin).normalize();

 if(targetOffset){
  direction.applyAxisAngle(
   new THREE.Vector3(0,1,0),
   targetOffset
  ).normalize();
 }

 const mesh=new THREE.Mesh(
  bossProjectileGeometry,
  bossProjectileMaterial
 );

 mesh.position.copy(origin);
 scene.add(mesh);

 const speed=bossPhase===2?6.6:5.5;
 const damage=bossPhase===2?21:16;

 bossProjectiles.push({
  mesh,
  velocity:direction.multiplyScalar(speed),
  damage,
  life:5
 });
}

function updateBossFight(dt){
 if(mode!=="BOSS"||!boss)return;

 bossElapsed+=dt;

 boss.rotation.y=Math.sin(bossElapsed*1.4)*.16;
 boss.position.y=1+Math.sin(bossElapsed*2.2)*.08;

 if(bossWarning>0){
  bossWarning-=dt;

  if(bossWarning<=0){
   bossAttackCount++;

   // Every third volley fires a three-shot fan.
   if(bossAttackCount%3===0){
    fireBossProjectile(-.22);
    fireBossProjectile(0);
    fireBossProjectile(.22);
   }else{
    fireBossProjectile();
   }

   bossAttackTimer=bossPhase===2?
    1.25:(bossElapsed<60?1.65:2.05);
  }
 }else{
  bossAttackTimer-=dt;

  if(bossAttackTimer<=0){
   bossWarning=.48;

   status(
    bossPhase===2?
    "BOSS ENRAGED — DODGE NOW!":
    "BOSS IS CHARGING — MOVE NOW!"
   );
  }
 }

 const player=new THREE.Vector3();
 camera.getWorldPosition(player);

 for(let i=bossProjectiles.length-1;i>=0;i--){
  const p=bossProjectiles[i];

  p.mesh.position.addScaledVector(p.velocity,dt);
  p.life-=dt;

  if(p.mesh.position.distanceTo(player)<.48){
   health=Math.max(0,health-p.damage);
   updateHUD();

   scene.remove(p.mesh);
   bossProjectiles.splice(i,1);

   status("HIT! HEALTH: "+health+" — KEEP DODGING!");

   if(health<=0){
    mode="BOSS_LOST";
    clearBossProjectiles();

    screenText("YOU WERE DEFEATED");
    status("BOSS WON THIS ROUND — TRY AGAIN OR RETURN TO MENU");

    if(boss){
     scene.remove(boss);
     boss=null;
    }

    addButton("RETRY BOSS",1.0,startBoss);
    addButton("BACK TO MENU",.65,showMenu);
    return;
   }
  }else if(
   p.life<=0||
   p.mesh.position.distanceTo(player)>24
  ){
   scene.remove(p.mesh);
   bossProjectiles.splice(i,1);
  }
 }
}

 document.getElementById("enterVR").style.display="none";
 document.getElementById("controls").style.display="block";
 document.getElementById("hud").style.display="block";

 status("REDLINE ARENA — MOBILE READY");
};

/* COMPUTER BUTTON TOUCH */
const menuRaycaster=new THREE.Raycaster();
const menuPointer=new THREE.Vector2();

function selectComputerButton(clientX,clientY){
 if(!computer.visible||buttons.length===0)return false;

 const rect=renderer.domElement.getBoundingClientRect();
 if(rect.width===0||rect.height===0)return false;

 menuPointer.x=((clientX-rect.left)/rect.width)*2-1;
 menuPointer.y=-((clientY-rect.top)/rect.height)*2+1;

 camera.updateMatrixWorld(true);
 computer.updateMatrixWorld(true);

 menuRaycaster.setFromCamera(menuPointer,camera);
 menuRaycaster.near=0;
 menuRaycaster.far=30;

 const hits=menuRaycaster.intersectObjects(buttons,false);
 if(!hits.length)return false;

 const action=hits[0].object.userData.action;

 if(typeof action==="function"){
  action();
  return true;
 }

 return false;
}

function updateRemotePlayers(){
 /*
  Remote avatar rendering is not implemented yet.
  This currently receives the players' position data.
 */
 for(const [uid,pos] of Object.entries(remotePlayers)){
  if(uid===auth.currentUser?.uid)continue;
  if(!pos||!Array.isArray(pos))continue;
 }
}

/* MOBILE JOYSTICK */
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");

let sx=0;
let sy=0;
let pointer=null;

function moveStick(e){
 const r=stick.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;

 let x=e.clientX-cx;
 let y=e.clientY-cy;
 let l=Math.hypot(x,y);
 const max=42;

 if(l>max){
  x=x/l*max;
  y=y/l*max;
 }

 sx=x/max;
 sy=y/max;

 knob.style.transform=`translate(${x}px,${y}px)`;
}

stick.onpointerdown=e=>{
 pointer=e.pointerId;
 stick.setPointerCapture(pointer);
 moveStick(e);
};

stick.onpointermove=e=>{
 if(e.pointerId===pointer)moveStick(e);
};

function resetStick(){
 sx=0;
 sy=0;
 pointer=null;
 knob.style.transform="translate(0,0)";
}

stick.onpointerup=resetStick;
stick.onpointercancel=resetStick;

let jump=false;
let vy=0;
let grounded=true;

document.getElementById("jump").onpointerdown=e=>{
 e.preventDefault();
 jump=true;
};

document.getElementById("jump").onpointerup=()=>jump=false;
document.getElementById("jump").onpointercancel=()=>jump=false;

let lookId=null;
let lx=0;
let ly=0;

/* COMPUTER BUTTONS BEFORE CAMERA LOOK */
renderer.domElement.addEventListener("pointerdown",e=>{
 if(!mobile||!computer.visible)return;

 if(selectComputerButton(e.clientX,e.clientY)){
  e.preventDefault();
  e.stopPropagation();
  return;
 }

 if(e.clientX<innerWidth*.42)return;

 lookId=e.pointerId;
 lx=e.clientX;
 ly=e.clientY;

 try{
  renderer.domElement.setPointerCapture(lookId);
 }catch(_){}
});

renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookId)return;

 yaw-=(e.clientX-lx)*.004;
 pitch-=(e.clientY-ly)*.003;

 pitch=THREE.MathUtils.clamp(pitch,-1.1,1.1);

 lx=e.clientX;
 ly=e.clientY;

 rig.rotation.y=yaw;
 camera.rotation.x=pitch;
});

function stopLook(e){
 if(e.pointerId===lookId)lookId=null;
}

renderer.domElement.addEventListener("pointerup",stopLook);
renderer.domElement.addEventListener("pointercancel",stopLook);

/* PLAYER MOVEMENT */
const clock=new THREE.Clock();
let previousSync=0;

function updatePlayer(dt){
 if(!mobile&&!renderer.xr.isPresenting)return;

 const forward=new THREE.Vector3();
 camera.getWorldDirection(forward);
 forward.y=0;
 forward.normalize();

 const right=new THREE.Vector3().crossVectors(
  forward,
  new THREE.Vector3(0,1,0)
 ).normalize();

 rig.position.addScaledVector(forward,-sy*2.8*dt);
 rig.position.addScaledVector(right,sx*2.8*dt);

 if(jump&&grounded){
  vy=4.2;
  grounded=false;
 }

 vy-=9.8*dt;
 rig.position.y+=vy*dt;

 if(rig.position.y<=0){
  rig.position.y=0;
  vy=0;
  grounded=true;
 }

 camera.getWorldPosition(head.position);

 torso.position.copy(head.position);
 torso.position.y-=.65;

 for(let i=0;i<2;i++){
  const side=i===0?-1:1;

  const shoulder=new THREE.Vector3(
   head.position.x+side*.2,
   head.position.y-.35,
   head.position.z
  );

  const hand=new THREE.Vector3(
   head.position.x+side*.5,
   head.position.y-.7,
   head.position.z-.3
  );

  segment(arms[i].arm,shoulder,hand);
  arms[i].hand.position.copy(hand);
  arms[i].band.position.copy(shoulder).lerp(hand,.7);
 }
}

/* BASIC PVP POSITION UPDATES */
async function syncPosition(){
 if(mode!=="PVP"||!roomCode||!auth.currentUser)return;

 const now=performance.now();
 if(now-previousSync<500)return;

 previousSync=now;

 try{
  const ref=doc(db,"rooms",roomCode);
  const positions={...remotePlayers};

  positions[auth.currentUser.uid]=[
   Number(rig.position.x.toFixed(2)),
   Number(rig.position.y.toFixed(2)),
   Number(rig.position.z.toFixed(2))
  ];

  await updateDoc(ref,{positions});
 }catch(e){
  console.warn("Position sync:",e.message);
 }
}

/* GAME LOOP */
renderer.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.05);

 if(mobile||renderer.xr.isPresenting){
  updatePlayer(dt);
  syncPosition();
 }

 if(boss){
  updateBossFight(dt);
 }

 renderer.render(scene,camera);
});

/* RESIZE */
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
