function savePlayerProfile(){

 localStorage.setItem("redlineWeapons",JSON.stringify(unlockedWeapons));

 localStorage.setItem("redlineTurrets",String(baseTurretLevel));

 if(!auth.currentUser)return Promise.resolve();
 const data={money,unlockedWeapons,equippedWeapon,baseTurretLevel,baseShieldLevel,updatedAt:serverTimestamp()};
 profileSaveQueue=profileSaveQueue.then(()=>setDoc(doc(db,"players",auth.currentUser.uid),data,{merge:true}))
 .catch(e=>console.warn("Profile save:",e.message));

}
async function loadPlayerProfile(){
 if(!auth.currentUser)return;
 try{
  const s=await getDoc(doc(db,"players",auth.currentUser.uid));
  if(s.exists()){
   const p=s.data();money=Math.max(0,Number(p.money??money));
   unlockedWeapons=Array.isArray(p.unlockedWeapons)?p.unlockedWeapons:["PISTOL"];
   if(!unlockedWeapons.includes("PISTOL"))unlockedWeapons.unshift("PISTOL");
   equippedWeapon=unlockedWeapons.includes(p.equippedWeapon)?p.equippedWeapon:"PISTOL";
   baseTurretLevel=Math.max(0,Number(p.baseTurretLevel)||0);
   baseShieldLevel=Math.max(0,Number(p.baseShieldLevel)||0);
  }else await savePlayerProfile();
  updateHUD();
 }catch(e){console.warn("Profile load:",e.message);}
}

/* MULTIPLAYER ROOMS */
function newCode(){return String(Math.floor(1000+Math.random()*9000));}
function defaultTeam(){
 return {level:1,kills:0,bossIndex:1,bossNextLevel:25,bossActive:false,bossHP:0,bossMaxHP:0,turretLevel:0,shieldLevel:0,updatedAt:Date.now()};
}
async function createRoom(visibility,gameType="PVP"){
 try{
  await authReady;if(!auth.currentUser)throw Error("PLAYER NOT SIGNED IN");
  status("CREATING ROOM...");
  for(let i=0;i<12;i++){
   const code=newCode(),ref=doc(db,"rooms",code);
   if((await getDoc(ref)).exists())continue;
   const data={code,hostUid:auth.currentUser.uid,players:[auth.currentUser.uid],votes:[],
    visibility,status:"open",gameType,positions:{},createdAt:serverTimestamp()};
   if(gameType==="ZOMBIE")data.zombieTeam=defaultTeam();
   await setDoc(ref,data);roomCode=code;openRoom(code);return;
  }
  status("COULD NOT CREATE ROOM");
 }catch(e){status("ROOM ERROR: "+e.message);}
}
async function joinRoom(code){
 await authReady;if(!auth.currentUser)throw Error("PLAYER NOT SIGNED IN");
 const ref=doc(db,"rooms",code);
 await runTransaction(db,async tx=>{
  const s=await tx.get(ref);if(!s.exists())throw Error("ROOM NOT FOUND");
  const r=s.data();if(r.status!=="open")throw Error("ROOM ALREADY STARTED");
  const players=Array.isArray(r.players)?r.players:[];
  if(!players.includes(auth.currentUser.uid))players.push(auth.currentUser.uid);
  if(players.length>10)throw Error("ROOM IS FULL");
  tx.update(ref,{players});
 });
 roomCode=code;openRoom(code);
}
async function joinPrivate(){
 const code=prompt("Enter the 4-digit room code:");if(!code)return;
 try{await joinRoom(code.trim());}catch(e){status(e.message);}
}
async function joinPublic(){
 try{
  await authReady;status("FINDING PUBLIC PVP SERVER...");
  const s=await getDocs(collection(db,"rooms"));
  const found=s.docs.find(d=>{const r=d.data();return r.visibility==="public"&&r.status==="open"&&r.gameType==="PVP"&&(r.players||[]).length<10;});
  if(found)await joinRoom(found.id);else await createRoom("public","PVP");
 }catch(e){status("PUBLIC SERVER ERROR: "+e.message);}
}
function openRoom(code){
 if(roomStop)roomStop();clearButtons();mode="WAITING";screenText("ROOM CODE: "+code);
 addButton("START MATCH",1.35,startMatch);addButton("LEAVE ROOM",1.0,leaveRoom);
 roomStop=onSnapshot(doc(db,"rooms",code),s=>{
  if(!s.exists()){status("ROOM CLOSED");return;}
  const r=s.data();
  isRoomHost=r.hostUid===auth.currentUser?.uid;
  remotePlayers=r.positions||{};
  updateRemotePlayers();
  if(r.status==="started"){
   if(r.gameType==="ZOMBIE")beginZombieFriends(r);
   else beginPvp();
  }else status("ROOM "+code+" — "+(r.players||[]).length+" PLAYER(S)");
 },e=>status("ROOM SYNC ERROR: "+e.message));
}
async function startMatch(){
 try{
  const ref=doc(db,"rooms",roomCode);
  await runTransaction(db,async tx=>{
   const s=await tx.get(ref);if(!s.exists())throw Error("ROOM NOT FOUND");
   const r=s.data(),players=r.players||[],votes=r.votes||[];
   if(!votes.includes(auth.currentUser.uid))votes.push(auth.currentUser.uid);
   const changes={votes,status:players.length>0&&players.every(p=>votes.includes(p))?"started":"open"};
   if(r.gameType==="ZOMBIE"&&!r.zombieTeam)changes.zombieTeam=defaultTeam();
   tx.update(ref,changes);
  });
  status("VOTE SENT — WAITING FOR PLAYERS");
 }catch(e){status("START ERROR: "+e.message);}
}
async function leaveRoom(){
 if(roomStop){roomStop();roomStop=null;}if(syncStop){syncStop();syncStop=null;}
 stopZombieMode();const code=roomCode;roomCode="";
 try{
  if(code&&auth.currentUser)await runTransaction(db,async tx=>{
   const ref=doc(db,"rooms",code),s=await tx.get(ref);if(!s.exists())return;
   const r=s.data(),players=(r.players||[]).filter(p=>p!==auth.currentUser.uid);
   const votes=(r.votes||[]).filter(p=>p!==auth.currentUser.uid);
   const positions={...(r.positions||{})};
   delete positions[auth.currentUser.uid];
   tx.update(ref,{players,votes,positions,status:players.length?"open":"closed",
    hostUid:r.hostUid===auth.currentUser.uid?(players[0]||""):r.hostUid});
  });
 }catch(e){console.warn(e);}showMenu();
}
function beginPvp(){
 if(mode==="PVP")return;
 mode="PVP";clearButtons();screenText("PVP MATCH");status("PVP MATCH — FIRE TO SHOOT");
}

const torso=new THREE.Mesh(new THREE.SphereGeometry(.28,20,16),black);torso.scale.set(.86,.72,.68);scene.add(torso);

 const band=new THREE.Mesh(new THREE.TorusGeometry(.095,.012,8,20),lava);
 scene.add(arm,hand,band);arms.push({arm,hand,band});
}
function segment(mesh,a,b){
 const d=new THREE.Vector3().subVectors(b,a);
 mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.scale.y=d.length();
 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
}

/* REMOTE PLAYER AVATARS */
function createRemoteAvatar(){
 const group=new THREE.Group();

 const body=new THREE.Mesh(new THREE.SphereGeometry(.3,16,14),black);
 body.scale.set(.9,1.15,.72);
 body.position.y=.95;
 group.add(body);

 const avatarHead=new THREE.Mesh(new THREE.SphereGeometry(.19,16,14),black);
 avatarHead.position.set(0,1.48,0);
 group.add(avatarHead);

 const chestAccent=new THREE.Mesh(new THREE.BoxGeometry(.18,.055,.035),lava);
 chestAccent.position.set(0,1.02,-.215);
 group.add(chestAccent);

 for(let i=0;i<2;i++){
  const side=i===0?-1:1;
  const armGroup=new THREE.Group();
  const upper=new THREE.Mesh(new THREE.CylinderGeometry(.085,.105,.52,10),black);
  upper.position.y=-.25;
  armGroup.add(upper);

  const hand=new THREE.Mesh(new THREE.SphereGeometry(.105,12,10),black);
  hand.position.y=-.52;
  armGroup.add(hand);

  const band=new THREE.Mesh(new THREE.TorusGeometry(.09,.018,8,16),lava);
  band.rotation.x=Math.PI/2;
  band.position.y=-.36;
  armGroup.add(band);

  armGroup.position.set(side*.31,.92,0);
  armGroup.rotation.z=side*.28;
  group.add(armGroup);
 }

 const leftEye=new THREE.Mesh(new THREE.SphereGeometry(.025,8,8),lava);
 leftEye.position.set(-.07,1.5,-.17);
 group.add(leftEye);
 const rightEye=leftEye.clone();
 rightEye.position.x=.07;
 group.add(rightEye);

 scene.add(group);
 return group;
}
function updateRemotePlayers(){
 const active=new Set();

 for(const [uid,pos] of Object.entries(remotePlayers)){
  if(uid===auth.currentUser?.uid)continue;
  if(!Array.isArray(pos)||pos.length<3)continue;

  const x=Number(pos[0]),y=Number(pos[1]),z=Number(pos[2]);
  if(!Number.isFinite(x)||!Number.isFinite(y)||!Number.isFinite(z))continue;

  active.add(uid);
  let avatar=remoteAvatarGroups[uid];
  if(!avatar)avatar=remoteAvatarGroups[uid]=createRemoteAvatar();

  avatar.position.set(x,y,z);
  avatar.rotation.y=Number(pos[3])||0;
 }

 for(const [uid,avatar] of Object.entries(remoteAvatarGroups)){
  if(!active.has(uid)){
   scene.remove(avatar);
   delete remoteAvatarGroups[uid];
  }
 }
}
function clearRemotePlayers(){
 for(const avatar of Object.values(remoteAvatarGroups))scene.remove(avatar);
 remoteAvatarGroups={};
}

/* SOLO BOSS BATTLE */
let boss=null,bossHP=0,bossMax=0,bossRewarded=false,lastPlayerShot=0,bossElapsed=0,bossAttackTimer=1;
let bossProjectiles=[];
function startBoss(){
 stopZombieMode();clearButtons();mode="BOSS";health=100;updateHUD();
 bossHP=bossMax=1500;bossRewarded=false;bossElapsed=0;bossAttackTimer=1;
 rig.position.set(0,0,-4.4);screenText("BOSS BATTLE");status("BOSS BATTLE — DODGE THE RED BLASTS!");
 if(boss)scene.remove(boss);boss=new THREE.Group();boss.position.set(0,1,-7);scene.add(boss);
 const mat=new THREE.MeshStandardMaterial({color:0x300710,emissive:0x8b0018});
 const body=new THREE.Mesh(new THREE.SphereGeometry(.8,24,20),mat);body.scale.y=1.3;boss.add(body);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.48,20,16),mat);h.position.y=1.1;boss.add(h);
 for(let i=0;i<2;i++){const e=new THREE.Mesh(new THREE.SphereGeometry(.08,12,12),lava);e.position.set(i?.2:-.2,1.15,-.42);boss.add(e);}
}
function damageBoss(){
 if(mode!=="BOSS"||!boss||bossHP<=0)return;
 const now=performance.now();if(now-lastPlayerShot<160)return;lastPlayerShot=now;
 bossHP=Math.max(0,bossHP-15);status("BOSS HEALTH: "+bossHP+"/"+bossMax);
 if(bossHP===0&&!bossRewarded){
  bossRewarded=true;mode="BOSS_WON";earnMoney(5000);scene.remove(boss);boss=null;
  screenText("BOSS DEFEATED!");status("BOSS DEFEATED! YOU EARNED $5,000!");
  addButton("FIGHT AGAIN",1.0,startBoss);addButton("BACK TO MENU",.65,showMenu);
 }
}
function updateBossFight(dt){
 if(mode!=="BOSS"||!boss)return;
 bossElapsed+=dt;boss.rotation.y=Math.sin(bossElapsed)*.15;
 if((bossAttackTimer-=dt)<=0){
  bossAttackTimer=2;
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),lava);
  const p=new THREE.Vector3(0,1.1,-.2);boss.localToWorld(p);mesh.position.copy(p);scene.add(mesh);
  const target=new THREE.Vector3();camera.getWorldPosition(target);
  bossProjectiles.push({mesh,v:target.sub(p).normalize().multiplyScalar(5),life:5});
 }
 const player=new THREE.Vector3();camera.getWorldPosition(player);
 for(let i=bossProjectiles.length-1;i>=0;i--){
  const p=bossProjectiles[i];p.mesh.position.addScaledVector(p.v,dt);p.life-=dt;
  if(p.mesh.position.distanceTo(player)<.5){
   health=Math.max(0,health-16);updateHUD();scene.remove(p.mesh);bossProjectiles.splice(i,1);
   if(health<=0){mode="BOSS_LOST";if(boss){scene.remove(boss);boss=null;}screenText("YOU WERE DEFEATED");addButton("RETRY BOSS",1,startBoss);addButton("BACK TO MENU",.65,showMenu);}
  }else if(p.life<=0){scene.remove(p.mesh);bossProjectiles.splice(i,1);}
 }
}

let zombies=[],sharedZombieMeshes=new Map(),zombieArenaObjects=[],baseObjects=[],turretObjects=[],shieldMesh=null;
let zombieLevel=1,zombieKills=0,zombieSpawnTimer=0,zombieGameOver=false,zombieFriends=false;
let zombieWeapon="PISTOL",zombieWeaponDamage=25,zombieFireDelay=350,zombieLastShot=0;
let zombieRaycaster=new THREE.Raycaster();
let zombieBoss=null,zombieBossHP=0,zombieBossMaxHP=0,zombieBossIndex=1,zombieBossNextLevel=25,zombieBossActive=false;
let zombieBossProjectiles=[],turretFireTimer=0,lastEnemySync=0;
const ARENA={minX:-29,maxX:29,minZ:-84,maxZ:-26};
const BASE={minX:-7.5,maxX:7.5,minZ:-48,maxZ:-29};
const zombieCollection=()=>collection(db,"rooms",roomCode,"zombies");
const teamRef=()=>doc(db,"rooms",roomCode);
function insideBase(x,z,p=0){return x>BASE.minX-p&&x<BASE.maxX+p&&z>BASE.minZ-p&&z<BASE.maxZ+p;}
function zombieKillsRequired(l){return 50*Math.pow(2,l-1);}
function zombieReward(l){return 25+5*(l-1);}
function zombieDamage(l){return 25*Math.pow(2,l-1);}
function zombieDifficulty(l){
 if(l<=1)return {speed:.48,attackDelay:3.5,hp:50,spawnDelay:2.6};
 if(l===2)return {speed:.58,attackDelay:3.1,hp:65,spawnDelay:2.4};
 if(l===3)return {speed:.68,attackDelay:2.8,hp:80,spawnDelay:2.2};
 return {speed:.8+(l-4)*.18,attackDelay:Math.max(.8,2.2-(l-4)*.15),hp:100+(l-4)*35,spawnDelay:Math.max(.55,1.9-(l-4)*.1)};
}
function updateZombieHUD(){

 }else info.textContent="";
}
function applyTeam(t){
 if(!t)return;
 zombieLevel=Number(t.level)||1;zombieKills=Number(t.kills)||0;
 zombieBossIndex=Number(t.bossIndex)||1;zombieBossNextLevel=Number(t.bossNextLevel)||25;
 zombieBossActive=!!t.bossActive;zombieBossHP=Number(t.bossHP)||0;
 zombieBossMaxHP=Number(t.bossMaxHP)||0;
 baseTurretLevel=Number(t.turretLevel)||0;baseShieldLevel=Number(t.shieldLevel)||0;
 localStorage.setItem("redlineTurrets",String(baseTurretLevel));
 localStorage.setItem("redlineShields",String(baseShieldLevel));
 createTurrets();createShieldVisual();
 if(zombieBossActive)ensureZombieBossVisual();else removeZombieBossVisual();
 updateZombieHUD();
}
async function ensureTeamExists(){
 const ref=teamRef();
 await runTransaction(db,async tx=>{
  const s=await tx.get(ref);if(!s.exists())throw Error("ROOM NOT FOUND");
  if(!s.data().zombieTeam)tx.update(ref,{zombieTeam:defaultTeam()});
 });
}
function listenToZombieTeam(){
 if(teamStop)teamStop();
 teamStop=onSnapshot(teamRef(),s=>{
  if(!s.exists())return;const t=s.data().zombieTeam;
  if(t)applyTeam(t);
 },e=>status("TEAM SYNC ERROR: "+e.message));
}
function listenToSharedZombies(){
 if(zombieStop)zombieStop();
 zombieStop=onSnapshot(zombieCollection(),snap=>{
  const seen=new Set();
  snap.forEach(d=>{
   const data=d.data();seen.add(d.id);
   if(data.dead)return;
   let item=sharedZombieMeshes.get(d.id);
   if(!item){item=createZombieVisual(data);sharedZombieMeshes.set(d.id,item);}
   item.group.position.set(Number(data.x)||0,0,Number(data.z)||0);
   item.hp=Number(data.hp)||0;item.maxHP=Number(data.maxHP)||item.maxHP;
   item.speed=Number(data.speed)||item.speed;item.attackDelay=Number(data.attackDelay)||item.attackDelay;
  });
  for(const [id,item] of sharedZombieMeshes){
   if(!seen.has(id)){scene.remove(item.group);sharedZombieMeshes.delete(id);}
  }
 },e=>status("ENEMY SYNC ERROR: "+e.message));
}

 const body=new THREE.Mesh(new THREE.SphereGeometry(.34,14,12),skin);body.position.y=.65;body.scale.set(.8,1.25,.65);group.add(body);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.22,14,12),skin);h.position.y=1.15;group.add(h);
 for(let i=0;i<2;i++){const e=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),eyes);e.position.set(i?.09:-.09,1.17,-.19);group.add(e);}
 for(let i=0;i<2;i++){const a=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.55,8),skin);a.position.set(i?.34:-.34,.72,-.02);a.rotation.z=i?.5:-.5;group.add(a);}
 for(let i=0;i<2;i++){const l=new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,.42,8),dark);l.position.set(i?.13:-.13,.2,0);group.add(l);}
 scene.add(group);
 return {group,hp:Number(data.hp)||50,maxHP:Number(data.maxHP)||50,speed:Number(data.speed)||.5,attackDelay:Number(data.attackDelay)||3,attackTimer:0,phase:0};
}
function clearZombies(){
 for(const z of zombies)scene.remove(z.group);zombies.length=0;
 for(const z of sharedZombieMeshes.values())scene.remove(z.group);

}
function chooseZombieSpawn(){
 for(let n=0;n<80;n++){
  const side=Math.floor(Math.random()*4);let x,z;
  if(side===0){x=BASE.minX-2-Math.random()*12;z=BASE.minZ+Math.random()*19;}
  if(side===1){x=BASE.maxX+2+Math.random()*12;z=BASE.minZ+Math.random()*19;}
  if(side===2){x=BASE.minX+Math.random()*15;z=BASE.minZ-2-Math.random()*12;}
  if(side===3){x=BASE.minX+Math.random()*15;z=BASE.maxZ+2+Math.random()*12;}
  x=THREE.MathUtils.clamp(x,-27,27);z=THREE.MathUtils.clamp(z,-82,-28);
  if(!insideBase(x,z,1))return {x,z};
 }
 return {x:13,z:-38};
}

async function hostStartBoss(){

  await runTransaction(db,async tx=>{

async function sharedBossHit(){
 if(!zombieFriends||!roomCode)return;
 let defeated=false,reward=0;
 try{
  await runTransaction(db,async tx=>{
   const s=await tx.get(teamRef());if(!s.exists())return;
   const t=s.data().zombieTeam;if(!t||!t.bossActive||t.bossHP<=0)return;
   const hp=Math.max(0,t.bossHP-zombieWeaponDamage);
   if(hp<=0){
    defeated=true;reward=1000*(t.bossIndex||1);
    tx.update(teamRef(),{zombieTeam:{...t,bossActive:false,bossHP:0,bossMaxHP:0,bossIndex:(t.bossIndex||1)+1,bossNextLevel:(t.bossNextLevel||25)*2,level:t.level+1,kills:0}});
   }else tx.update(teamRef(),{zombieTeam:{...t,bossHP:hp}});
  });
  if(defeated){earnMoney(reward);health=100;updateHUD();status("TEAM BOSS DEFEATED! YOU EARNED $"+reward);}
 }catch(e){status("BOSS SYNC ERROR: "+e.message);}
}
async function sharedZombieHit(id){
 if(!zombieFriends||!roomCode)return;
 let killed=false,reward=0,levelBefore=zombieLevel;
 try{
  await runTransaction(db,async tx=>{
   const zr=doc(zombieCollection(),id),zs=await tx.get(zr);
   if(!zs.exists())return;
   const rs=await tx.get(teamRef());if(!rs.exists())return;
   const z=zs.data();if(z.dead||z.hp<=0)return;
   const hp=Number(z.hp)-zombieWeaponDamage;
   if(hp<=0){
    const t=rs.data().zombieTeam||defaultTeam();killed=true;reward=zombieReward(t.level);
    const kills=(t.kills||0)+1,need=zombieKillsRequired(t.level);
    const levelUp=kills>=need;
    const next={...t,kills:levelUp?0:kills,level:levelUp?t.level+1:t.level};
    if(levelUp)next.updatedAt=Date.now();
    tx.delete(zr);tx.update(teamRef(),{zombieTeam:next});
   }else tx.update(zr,{hp});
  });
  if(killed){earnMoney(reward);status("TEAM ZOMBIE KILLED! +$"+reward);}
 }catch(e){status("ZOMBIE HIT ERROR: "+e.message);}
}

async function syncSharedEnemyMovement(dt){
 if(!zombieFriends||!isRoomHost||zombieBossActive||zombieGameOver)return;
 const now=performance.now();if(now-lastEnemySync<300)return;lastEnemySync=now;
 const player=new THREE.Vector3();camera.getWorldPosition(player);
 const updates=[];
 for(const [id,z] of sharedZombieMeshes){
  const dx=player.x-z.group.position.x,dz=player.z-z.group.position.z,dist=Math.hypot(dx,dz);
  if(dist>.1){
   const nx=z.group.position.x+dx/dist*z.speed*.3,nz=z.group.position.z+dz/dist*z.speed*.3;
   if(!insideBase(nx,nz,.05)){z.group.position.x=nx;z.group.position.z=nz;}
  }
  updates.push(updateDoc(doc(zombieCollection(),id),{x:z.group.position.x,z:z.group.position.z}).catch(()=>{}));
 }
 await Promise.all(updates);
}

async function buyTeamUpgrade(kind){
 const isTurret=kind==="turret",max=isTurret?4:3,base=isTurret?1500:2000,step=isTurret?1500:2000;
 try{
  if(zombieFriends){
   const profileRef=doc(db,"players",auth.currentUser.uid),roomRef=teamRef();
   let newLevel=0,price=0;
   await runTransaction(db,async tx=>{
    const ps=await tx.get(profileRef),rs=await tx.get(roomRef);
    if(!ps.exists()||!rs.exists())throw Error("PROFILE OR ROOM NOT FOUND");
    const p=ps.data(),t=rs.data().zombieTeam||defaultTeam();
    const level=isTurret?(t.turretLevel||0):(t.shieldLevel||0);
    price=base+level*step;
    if(level>=max)throw Error("UPGRADE IS ALREADY MAX LEVEL");
    if((Number(p.money)||0)<price)throw Error("NOT ENOUGH MONEY — NEED $"+price);
    newLevel=level+1;
    const updated={...t,[isTurret?"turretLevel":"shieldLevel"]:newLevel};
    tx.update(profileRef,{money:Number(p.money)-price,updatedAt:serverTimestamp()});
    tx.update(roomRef,{zombieTeam:updated});
   });
   money=Math.max(0,money-price);savePlayerProfile();
   status("TEAM "+(isTurret?"TURRET":"SHIELD")+" UPGRADED TO LEVEL "+newLevel);
  }else{
   const level=isTurret?baseTurretLevel:baseShieldLevel,price=base+level*step;
   if(level>=max)throw Error("UPGRADE IS ALREADY MAX LEVEL");
   if(money<price)throw Error("NOT ENOUGH MONEY — NEED $"+price);
   money-=price;if(isTurret)baseTurretLevel++;else baseShieldLevel++;
   savePlayerProfile();status("BASE UPGRADED!");
  }
  createTurrets();createShieldVisual();updateHUD();showBaseShop();
 }catch(e){status(e.message);}
}
function buyTurretUpgrade(){buyTeamUpgrade("turret");}
function buyShieldUpgrade(){buyTeamUpgrade("shield");}

/* WEAPON SHOP */
function equipWeapon(name){
 const w=weaponList.find(v=>v.name===name);if(!w||!unlockedWeapons.includes(name))return;
 equippedWeapon=name;zombieWeapon=name;zombieWeaponDamage=w.damage;zombieFireDelay=w.delay;
 savePlayerProfile();status(name+" EQUIPPED");showZombieShop();
}
function buyWeapon(name){
 const i=weaponList.findIndex(v=>v.name===name);if(i<0)return;
 if(unlockedWeapons.includes(name)){equipWeapon(name);return;}
 if(i>0&&!unlockedWeapons.includes(weaponList[i-1].name)){status("BUY "+weaponList[i-1].name+" FIRST");return;}
 const w=weaponList[i];if(money<w.price){status("NOT ENOUGH MONEY — NEED $"+w.price);return;}
 money-=w.price;unlockedWeapons.push(name);equippedWeapon=name;zombieWeapon=name;
 zombieWeaponDamage=w.damage;zombieFireDelay=w.delay;savePlayerProfile();updateHUD();
 status(name+" PURCHASED AND EQUIPPED!");showZombieShop();
}

 zombieLevel++;zombieKills=0;health=100;updateZombieHUD();
 if(zombieLevel>=zombieBossNextLevel)startZombieBossSolo();
 else{status("LEVEL "+zombieLevel+"! ZOMBIES ARE GETTING STRONGER!");screenText("LEVEL "+zombieLevel);}
}
function killZombieSolo(index){
 const z=zombies[index];if(!z)return;scene.remove(z.group);zombies.splice(index,1);
 const reward=zombieReward(zombieLevel);earnMoney(reward);zombieKills++;
 if(zombieKills>=zombieKillsRequired(zombieLevel))zombieLevelUpSolo();else updateZombieHUD();
}
async function shootZombie(){
 if(zombieGameOver)return;
 const now=performance.now();if(now-zombieLastShot<zombieFireDelay)return;zombieLastShot=now;
 camera.updateMatrixWorld(true);zombieRaycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 if(zombieBossActive&&zombieBoss){
  const hits=zombieRaycaster.intersectObjects(zombieBoss.children,true);
  if(hits.length){
   if(zombieFriends)await sharedBossHit();
   else{
    zombieBossHP=Math.max(0,zombieBossHP-zombieWeaponDamage);
    if(zombieBossHP<=0)defeatZombieBossSolo();
    else status("BOSS HIT! "+Math.ceil(zombieBossHP)+" / "+zombieBossMaxHP+" HP");
   }
   return;
  }
 }
 const targets=[];
 if(zombieFriends){for(const z of sharedZombieMeshes.values())for(const c of z.group.children)targets.push(c);}
 else{for(const z of zombies)for(const c of z.group.children)targets.push(c);}
 const hits=zombieRaycaster.intersectObjects(targets,true);
 if(!hits.length){status(zombieWeapon+" FIRED — NO TARGET HIT");return;}
 const target=hits[0].object;
 if(zombieFriends){
  for(const [id,z] of sharedZombieMeshes){if(z.group===target.parent||z.group.children.includes(target)||z.group.getObjectById(target.id)){await sharedZombieHit(id);return;}}
 }else{
  const index=zombies.findIndex(z=>z.group===target.parent||z.group.children.includes(target)||z.group.getObjectById(target.id));
  if(index>=0){zombies[index].hp-=zombieWeaponDamage;if(zombies[index].hp<=0)killZombieSolo(index);else status("ZOMBIE HIT! "+Math.ceil(zombies[index].hp)+" HP LEFT");}
 }
}
function defeatZombieBossSolo(){
 if(!zombieBossActive)return;
 const reward=1000*zombieBossIndex;zombieBossActive=false;removeZombieBossVisual();
 earnMoney(reward);zombieBossIndex++;zombieBossNextLevel*=2;health=100;updateHUD();
 status("BOSS DEFEATED! +$"+reward+" — NEXT BOSS AT LEVEL "+zombieBossNextLevel);zombieSpawnTimer=1;updateZombieHUD();
}
function endZombieGame(){
 if(zombieGameOver)return;document.getElementById("crosshair").style.display="none";
 zombieGameOver=true;zombieBossActive=false;clearZombies();removeZombieBossVisual();
 clearButtons();screenText("YOU WERE DEFEATED");status("YOU WERE DEFEATED ON LEVEL "+zombieLevel);
 addButton("TRY AGAIN",1,()=>startZombieMode(zombieFriends));
 addButton("WEAPON SHOP",.65,showZombieShop);addButton("BACK TO MENU",.3,showMenu);
}

/* ZOMBIE AI: HOST MOVES SHARED ENEMIES; SOLO SIMULATES LOCALLY */
function updateZombieSolo(dt){
 if(mode!=="ZOMBIE"||zombieGameOver)return;
 if(zombieBossActive)return;
 zombieSpawnTimer-=dt;
 if(zombieSpawnTimer<=0&&zombies.length<Math.min(8+zombieLevel*2,24)){
  spawnZombieSolo();zombieSpawnTimer=zombieDifficulty(zombieLevel).spawnDelay;
 }
 const player=new THREE.Vector3();camera.getWorldPosition(player);
 for(let i=zombies.length-1;i>=0;i--){
  const z=zombies[i],g=z.group,dx=player.x-g.position.x,dz=player.z-g.position.z,dist=Math.hypot(dx,dz);
  if(dist>.001){
   const nx=g.position.x+dx/dist*z.speed*dt,nz=g.position.z+dz/dist*z.speed*dt;
   if(!insideBase(nx,nz,.05)){g.position.x=nx;g.position.z=nz;}
   g.rotation.y=Math.atan2(dx,dz);
  }
  z.attackTimer-=dt;
  if(dist<1.25&&z.attackTimer<=0){
   let damage=zombieDamage(zombieLevel);
   if(insideBase(player.x,player.z)){if(baseShieldLevel>0)damage=Math.ceil(damage/(1+baseShieldLevel));else damage=0;}
   if(damage){health=Math.max(0,health-damage);updateHUD();status("ZOMBIE HIT YOU FOR "+damage+" DAMAGE!");}
   else status("HEADQUARTERS SHIELD BLOCKED THE ATTACK!");
   z.attackTimer=z.attackDelay;if(health<=0){endZombieGame();return;}
  }
 }
}
async function updateZombieFriends(dt){
 if(mode!=="ZOMBIE_FRIENDS"||zombieGameOver)return;
 if(zombieBossActive){
  if(isRoomHost){
   /* Shared boss activation is performed once by the host at the team milestone. */
  }
  updateBossAttacks(dt);return;
 }
 if(isRoomHost){
  zombieSpawnTimer-=dt;
  if(zombieSpawnTimer<=0&&sharedZombieMeshes.size<Math.min(8+zombieLevel*2,24)){
   await hostSpawnZombie();zombieSpawnTimer=zombieDifficulty(zombieLevel).spawnDelay;
  }
  await syncSharedEnemyMovement(dt);
 }
 const player=new THREE.Vector3();camera.getWorldPosition(player);
 for(const z of sharedZombieMeshes.values()){
  const dx=player.x-z.group.position.x,dz=player.z-z.group.position.z,dist=Math.hypot(dx,dz);
  z.attackTimer-=dt;
  if(dist<1.25&&z.attackTimer<=0){
   let damage=zombieDamage(zombieLevel);
   if(insideBase(player.x,player.z)){if(baseShieldLevel>0)damage=Math.ceil(damage/(1+baseShieldLevel));else damage=0;}
   if(damage){health=Math.max(0,health-damage);updateHUD();status("ZOMBIE HIT YOU FOR "+damage+" DAMAGE!");}
   else status("HEADQUARTERS SHIELD BLOCKED THE ATTACK!");
   z.attackTimer=z.attackDelay;if(health<=0){endZombieGame();return;}
  }
 }
 if(isRoomHost&&zombieLevel>=zombieBossNextLevel&&!zombieBossActive)await hostStartBoss();
}

/* BOSS PROJECTILES */
let zombieBossAttackTimer=2,zombieBossElapsed=0;
function updateBossAttacks(dt){
 if(!zombieBossActive||!zombieBoss)return;
 zombieBossElapsed+=dt;zombieBoss.position.y=Math.sin(zombieBossElapsed*2)*.12;
 zombieBossAttackTimer-=dt;
 if(zombieBossAttackTimer<=0){
  zombieBossAttackTimer=Math.max(.8,2.2-zombieBossIndex*.08);
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(.18,12,10),lava);
  const origin=zombieBoss.localToWorld(new THREE.Vector3(0,2.2,-.5));mesh.position.copy(origin);scene.add(mesh);
  const target=new THREE.Vector3();camera.getWorldPosition(target);
  zombieBossProjectiles.push({mesh,v:target.sub(origin).normalize().multiplyScalar(7),life:6});
 }
 const player=new THREE.Vector3();camera.getWorldPosition(player);
 for(let i=zombieBossProjectiles.length-1;i>=0;i--){
  const p=zombieBossProjectiles[i];p.mesh.position.addScaledVector(p.v,dt);p.life-=dt;
  if(p.mesh.position.distanceTo(player)<.55){
   let damage=Math.min(250,25+zombieBossIndex*10);
   if(insideBase(player.x,player.z)&&baseShieldLevel>0)damage=Math.ceil(damage/(1+baseShieldLevel));
   health=Math.max(0,health-damage);updateHUD();scene.remove(p.mesh);zombieBossProjectiles.splice(i,1);
   status("BOSS BLAST HIT YOU FOR "+damage+" DAMAGE!");
   if(health<=0){endZombieGame();return;}
  }else if(p.life<=0){scene.remove(p.mesh);zombieBossProjectiles.splice(i,1);}
 }
}
function clearZombieProjectiles(){for(const p of zombieBossProjectiles)scene.remove(p.mesh);zombieBossProjectiles.length=0;}

/* TURRETS */
function updateTurrets(dt){
 if(mode!=="ZOMBIE"&&mode!=="ZOMBIE_FRIENDS")return;
 if(zombieGameOver||baseTurretLevel<=0)return;
 if(zombieFriends&&!isRoomHost)return;
 turretFireTimer-=dt;if(turretFireTimer>0)return;
 turretFireTimer=Math.max(.18,.9-baseTurretLevel*.15);
 const targets=zombieFriends?[...sharedZombieMeshes.values()]:zombies;
 for(const turret of turretObjects){
  let target=null,best=Infinity;
  for(const z of targets){const d=turret.position.distanceTo(z.group.position);if(d<best&&d<22){best=d;target=z;}}
  if(!target)continue;
  const direction=new THREE.Vector3().subVectors(target.group.position,turret.position);direction.y=0;
  turret.rotation.y=Math.atan2(direction.x,direction.z);
  if(zombieFriends){
   /* Host turret damage is applied to the shared enemy document. */
   const entry=[...sharedZombieMeshes.entries()].find(([,v])=>v===target);
   if(entry)sharedZombieHitByTurret(entry[0],12*baseTurretLevel);
  }else{
   target.hp-=12*baseTurretLevel;
   if(target.hp<=0){const i=zombies.indexOf(target);if(i>=0)killZombieSolo(i);}
  }
 }
}
async function sharedZombieHitByTurret(id,damage){
 try{
  await runTransaction(db,async tx=>{
   const zr=doc(zombieCollection(),id),zs=await tx.get(zr);if(!zs.exists())return;
   const rs=await tx.get(teamRef());if(!rs.exists())return;
   const z=zs.data();if(z.hp>damage)tx.update(zr,{hp:z.hp-damage});
   else{
    const t=rs.data().zombieTeam||defaultTeam(),kills=(t.kills||0)+1,need=zombieKillsRequired(t.level);
    const up=kills>=need;tx.delete(zr);
    tx.update(teamRef(),{zombieTeam:{...t,kills:up?0:kills,level:up?t.level+1:t.level}});
   }
  });
 }catch(e){}
}

/* SHOOTING AND CONTROLS */
function shoot(){
 if(mode==="BOSS"){damageBoss();return;}
 if(mode==="ZOMBIE"||mode==="ZOMBIE_FRIENDS"){shootZombie();return;}
 if(mode==="PVP")status("PVP SHOT FIRED");
}
document.getElementById("fire").addEventListener("pointerdown",e=>{e.preventDefault();shoot();});
const controllers=[];
for(let i=0;i<2;i++){const c=renderer.xr.getController(i);c.addEventListener("select",shoot);rig.add(c);controllers.push(c);}
document.getElementById("enterVR").onclick=async()=>{
 try{
  const session=await navigator.xr.requestSession("immersive-vr",{optionalFeatures:["local-floor","hand-tracking"]});
  renderer.xr.setReferenceSpaceType("local-floor");await renderer.xr.setSession(session);
  computer.visible=true;showMenu();
  document.getElementById("enter").style.display="none";document.getElementById("enterVR").style.display="none";
  document.getElementById("hud").style.display="block";
  session.addEventListener("end",()=>{
   document.getElementById("enter").style.display="block";document.getElementById("enterVR").style.display="block";
   document.getElementById("hud").style.display="none";computer.visible=false;
  });
 }catch(e){status("VR ERROR: "+e.message);}
};
if(navigator.xr)navigator.xr.isSessionSupported("immersive-vr").then(ok=>{if(ok)document.getElementById("enterVR").style.display="block";}).catch(()=>{});

/* MOBILE */
let mobile=false,yaw=0,pitch=0;
document.getElementById("enter").onclick=()=>{
 mobile=true;rig.position.set(0,0,-4.4);computer.visible=true;showMenu();
 document.getElementById("enter").style.display="none";document.getElementById("enterVR").style.display="none";
 document.getElementById("controls").style.display="block";document.getElementById("hud").style.display="block";
 status("REDLINE ARENA — MOBILE READY");
};
const menuRaycaster=new THREE.Raycaster(),menuPointer=new THREE.Vector2();
function selectComputerButton(x,y){
 if(!computer.visible||!buttons.length)return false;
 const r=renderer.domElement.getBoundingClientRect();if(!r.width||!r.height)return false;
 menuPointer.x=((x-r.left)/r.width)*2-1;menuPointer.y=-((y-r.top)/r.height)*2+1;
 camera.updateMatrixWorld(true);computer.updateMatrixWorld(true);
 menuRaycaster.setFromCamera(menuPointer,camera);menuRaycaster.near=0;menuRaycaster.far=30;
 const hits=menuRaycaster.intersectObjects(buttons,false);if(!hits.length)return false;
 const action=hits[0].object.userData.action;if(typeof action==="function"){action();return true;}return false;
}
const stick=document.getElementById("stick"),knob=document.getElementById("knob");
let sx=0,sy=0,pointer=null;
function moveStick(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let x=e.clientX-cx,y=e.clientY-cy,l=Math.hypot(x,y),max=42;
 if(l>max){x=x/l*max;y=y/l*max;}sx=x/max;sy=y/max;knob.style.transform=`translate(${x}px,${y}px)`;
}
stick.onpointerdown=e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e);};
stick.onpointermove=e=>{if(e.pointerId===pointer)moveStick(e);};
function resetStick(){sx=0;sy=0;pointer=null;knob.style.transform="translate(0,0)";}
stick.onpointerup=resetStick;stick.onpointercancel=resetStick;
let jump=false,vy=0,grounded=true;
document.getElementById("jump").onpointerdown=e=>{e.preventDefault();jump=true;};
document.getElementById("jump").onpointerup=()=>jump=false;
document.getElementById("jump").onpointercancel=()=>jump=false;
let lookId=null,lx=0,ly=0;
renderer.domElement.addEventListener("pointerdown",e=>{
 if(!mobile||!computer.visible)return;
 if(selectComputerButton(e.clientX,e.clientY)){e.preventDefault();e.stopPropagation();return;}
 if(e.clientX<innerWidth*.42)return;
 lookId=e.pointerId;lx=e.clientX;ly=e.clientY;
 try{renderer.domElement.setPointerCapture(lookId);}catch(_){}
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookId)return;
 yaw-=(e.clientX-lx)*.004;pitch-=(e.clientY-ly)*.003;
 pitch=THREE.MathUtils.clamp(pitch,-1.1,1.1);lx=e.clientX;ly=e.clientY;
 rig.rotation.y=yaw;camera.rotation.x=pitch;
});
function stopLook(e){if(e.pointerId===lookId)lookId=null;}
renderer.domElement.addEventListener("pointerup",stopLook);
renderer.domElement.addEventListener("pointercancel",stopLook);

/* MOVEMENT AND POSITION SYNC */
const clock=new THREE.Clock();let previousSync=0;
function updatePlayer(dt){
 if(!mobile&&!renderer.xr.isPresenting)return;
 const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();
 const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();
 rig.position.addScaledVector(forward,-sy*2.8*dt);rig.position.addScaledVector(right,sx*2.8*dt);
 if(jump&&grounded){vy=4.2;grounded=false;}
 vy-=9.8*dt;rig.position.y+=vy*dt;
 if(rig.position.y<=0){rig.position.y=0;vy=0;grounded=true;}
 if(mode==="ZOMBIE"||mode==="ZOMBIE_FRIENDS"){
  rig.position.x=THREE.MathUtils.clamp(rig.position.x,-27,27);
  rig.position.z=THREE.MathUtils.clamp(rig.position.z,-82,-28);
 }
 camera.getWorldPosition(head.position);torso.position.copy(head.position);torso.position.y-=.65;
 for(let i=0;i<2;i++){
  const side=i===0?-1:1;
  const shoulder=new THREE.Vector3(head.position.x+side*.2,head.position.y-.35,head.position.z);
  const hand=new THREE.Vector3(head.position.x+side*.5,head.position.y-.7,head.position.z-.3);
  segment(arms[i].arm,shoulder,hand);arms[i].hand.position.copy(hand);arms[i].band.position.copy(shoulder).lerp(hand,.7);
 }
}
async function syncPosition(){
 if((mode!=="PVP"&&mode!=="ZOMBIE_FRIENDS")||!roomCode||!auth.currentUser)return;
 const now=performance.now();
 if(now-previousSync<300)return;
 previousSync=now;
 try{
  const uid=auth.currentUser.uid;
  const pos=[
   Number(rig.position.x.toFixed(2)),
   Number(rig.position.y.toFixed(2)),
   Number(rig.position.z.toFixed(2)),
   Number(rig.rotation.y.toFixed(3))
  ];
  await updateDoc(doc(db,"rooms",roomCode),{[`positions.${uid}`]:pos});
 }catch(e){console.warn("Position sync:",e.message);}
}

/* CLEANUP */
function stopZombieMode(){
 if(zombieStop){zombieStop();zombieStop=null;}
 if(teamStop){teamStop();teamStop=null;}
 clearZombies();zombieGameOver=true;zombieBossActive=false;removeZombieBossVisual();clearZombieProjectiles();
 for(const o of zombieArenaObjects)scene.remove(o);zombieArenaObjects.length=0;
 for(const o of baseObjects)scene.remove(o);baseObjects.length=0;
 for(const t of turretObjects)scene.remove(t);turretObjects.length=0;
 shieldMesh=null;
 if(mode==="ZOMBIE"||mode==="ZOMBIE_FRIENDS"||mode==="ZOMBIE_LOST")computer.position.set(0,0,-7);
}

/* MAIN LOOP */
renderer.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.05);
 if(mobile||renderer.xr.isPresenting){updatePlayer(dt);syncPosition();}
 if(boss)updateBossFight(dt);
 if(mode==="ZOMBIE")updateZombieSolo(dt);
 if(mode==="ZOMBIE_FRIENDS")updateZombieFriends(dt);
 updateTurrets(dt);
 renderer.render(scene,camera);
});
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
authReady.then(()=>{updateHUD();if(mode==="MENU"&&balancePanel)showMenu();});
</script>
